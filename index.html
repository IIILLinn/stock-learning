<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股海导航 · 系统学习炒股知识图谱</title>
<style>
:root{
  --bg:#0a0f1e; --bg2:#0e1528; --panel:rgba(15,21,40,.88); --line:rgba(255,255,255,.09);
  --text:#e8ecf6; --muted:#93a0bd; --dim:#5b6b8c; --accent:#6ea8fe; --ok:#3ecf8e;
  --c0:#f5b13d; --c1:#4da3ff; --c2:#3ecf8e; --c3:#a78bfa; --c4:#fb7185; --c5:#fb923c; --c6:#2dd4bf; --c7:#f472b6;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 800px at 70% -10%, #152036 0%, var(--bg) 55%) var(--bg);
  color:var(--text); overflow:hidden;
}
a{color:var(--accent); text-decoration:none;}
/* ---------- header ---------- */
header{
  position:fixed; top:0; left:0; right:0; height:56px; z-index:50;
  display:flex; align-items:center; gap:16px; padding:0 18px;
  background:rgba(10,15,30,.82); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; min-width:230px;}
.brand .logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,#1d2c55,#122); border:1px solid rgba(110,168,254,.5); font-size:16px;}
.brand h1{font-size:15px; font-weight:700; letter-spacing:.5px;}
.brand small{display:block; font-size:10.5px; color:var(--muted); font-weight:400; margin-top:1px;}
.searchwrap{flex:1; max-width:380px; position:relative;}
.searchwrap input{
  width:100%; background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--text);
  border-radius:20px; padding:7px 14px 7px 34px; font-size:13px; outline:none; transition:.2s;
}
.searchwrap input:focus{border-color:rgba(110,168,254,.6); background:rgba(255,255,255,.08);}
.searchwrap .si{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--dim); font-size:13px;}
.hstats{display:flex; align-items:center; gap:12px; margin-left:auto; font-size:12.5px; color:var(--muted);}
.progressbar{width:110px; height:6px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden;}
.progressbar i{display:block; height:100%; width:0%; border-radius:4px; background:linear-gradient(90deg,var(--c6),var(--c2),var(--accent)); transition:width .4s;}
.hbtn{background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; transition:.2s;}
.hbtn:hover{color:var(--text); border-color:rgba(255,255,255,.25);}
/* ---------- layout ---------- */
#app{position:fixed; top:56px; left:0; right:0; bottom:0; display:flex;}
#left{width:270px; min-width:270px; border-right:2px solid var(--line); overflow-y:auto; padding:14px 12px 40px; background:rgba(12,17,34,.6);}
#center{flex:1; position:relative; min-width:0;}
#right{width:var(--rightW,0px); min-width:0; border-left:2px solid var(--line); overflow-y:auto; overflow-x:hidden; padding:18px 22px 40px; background:rgba(12,17,34,.6); transition:width .25s ease, border-color .25s ease;}
#right.empty{display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:13px; text-align:center;}
/* ---------- left: path ---------- */
.pathhead{font-size:12px; color:var(--dim); letter-spacing:1px; margin:4px 4px 10px; display:flex; justify-content:space-between; align-items:center;}
.pathhead b{color:var(--muted); font-weight:600;}
.contbtn{width:100%; margin-bottom:12px; padding:9px; border:none; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600;
  background:linear-gradient(90deg,#1d3a6b,#123); color:#cfe0ff; border:1px solid rgba(110,168,254,.35); transition:.2s;}
.contbtn:hover{filter:brightness(1.2);}
.pmod{margin-bottom:12px; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:rgba(255,255,255,.02);}
.pmod>summary{list-style:none; display:flex; align-items:center; gap:8px; padding:9px 10px; cursor:pointer; font-size:13px; font-weight:600;}
.pmod>summary::-webkit-details-marker{display:none;}
.pmod>summary .dot{width:10px;height:10px;border-radius:3px; flex:none;}
.pmod>summary .cnt{margin-left:auto; font-size:11px; color:var(--dim); font-weight:400;}
.pmod .items{padding:2px 8px 8px;}
.pitem{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; cursor:pointer; font-size:12.5px; color:var(--muted); transition:.15s;}
.pitem:hover{background:rgba(255,255,255,.05); color:var(--text);}
.pitem.active{background:rgba(110,168,254,.16); color:#fff;}
.pitem .ck{width:16px;height:16px;border-radius:5px; border:1.5px solid rgba(255,255,255,.22); flex:none; display:grid; place-items:center; font-size:10px; color:transparent; transition:.2s;}
.pitem.done .ck{background:var(--ok); border-color:var(--ok); color:#062;}
.pitem .idx{font-size:10px; color:var(--dim); width:16px; text-align:right; flex:none; font-variant-numeric:tabular-nums;}
.pitem.done{color:var(--dim);}
.pitem.done .t{text-decoration:line-through; opacity:.7;}
.pitem .t{flex:1;}
/* ---------- center: graph ---------- */
#graph{position:absolute; inset:0;}
#graph svg{width:100%; height:100%; display:block;}
.node{cursor:pointer;}
.node circle{transition:r .25s, fill-opacity .2s, stroke .2s;}
.node text.lbl{fill:#c9d4e8; font-size:11px; text-anchor:middle; pointer-events:none;}
.node text.em{pointer-events:none;}
.node .halo{fill:none; stroke:var(--accent); stroke-width:1.4; opacity:0; transition:opacity .2s;}
.node:hover .halo{opacity:.9;}
.node.selected .halo{opacity:1; stroke-width:2;}
.node.done circle{stroke-dasharray:none;}
.node .checkmark{opacity:0; pointer-events:none;}
.node.done .checkmark{opacity:1;}
.edge{stroke:rgba(255,255,255,.16); stroke-width:1; pointer-events:none; transition:opacity .25s;}
.edge.rel{stroke-dasharray:4 4; stroke:rgba(255,255,255,.10);}
.edge.belong{stroke:rgba(255,255,255,.06);}
.legend{
  position:absolute; left:12px; bottom:12px; background:rgba(13,18,36,.85); border:1px solid var(--line);
  border-radius:12px; padding:10px 12px; font-size:11.5px; display:flex; flex-wrap:wrap; gap:8px; max-width:520px;
}
.legend .lg{display:flex; align-items:center; gap:6px; cursor:pointer; padding:3px 6px; border-radius:7px; transition:.15s;}
.legend .lg:hover{background:rgba(255,255,255,.06);}
.legend .lg.off{opacity:.35;}
.legend .dot{width:10px;height:10px;border-radius:3px;}
.legend .lgt{color:var(--muted);}
.edgelegend{margin-left:auto; display:flex; gap:12px; color:var(--dim); align-items:center;}
.edgelegend i{display:inline-block; width:22px; height:0; border-top:1.5px solid rgba(255,255,255,.3); vertical-align:middle; margin-right:4px;}
.edgelegend i.dashed{border-top:1.5px dashed rgba(255,255,255,.2);}
.hint{position:absolute; right:12px; bottom:12px; font-size:11px; color:var(--dim); background:rgba(13,18,36,.8); border:1px solid var(--line); padding:7px 10px; border-radius:10px; max-width:300px; line-height:1.7;}
.empty-state{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--dim); font-size:14px; gap:8px; pointer-events:none;}
/* ---------- right: detail ---------- */
.dtag{display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); border:1px solid var(--line); padding:3px 9px; border-radius:20px; margin-bottom:10px;}
.dtitle{font-size:19px; font-weight:700; margin-bottom:4px; line-height:1.4;}
.dsub{font-size:12.5px; color:var(--muted); margin-bottom:14px; line-height:1.6;}
.dsec{font-size:12px; font-weight:700; color:var(--muted); margin:16px 0 8px; letter-spacing:1px; display:flex; align-items:center; gap:6px;}
.dsec::after{content:""; flex:1; height:1px; background:var(--line);}
.dlist{list-style:none;}
.dlist li{position:relative; padding:0 0 8px 18px; font-size:13px; line-height:1.65; color:#d6deee;}
.dlist li::before{content:""; position:absolute; left:2px; top:9px; width:6px; height:6px; border-radius:2px; background:var(--accent);}
.dlist.warn li::before{background:#f59e0b;}
.dlist.do li::before{background:var(--ok);}
.dlist.warn li, .dlist.do li{font-size:12.8px;}
.links{display:flex; flex-wrap:wrap; gap:7px;}
.chip{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:#cdd8ea;
  border-radius:16px; padding:5px 11px; font-size:12px; cursor:pointer; transition:.15s; max-width:100%;}
.chip:hover{border-color:rgba(110,168,254,.5); background:rgba(110,168,254,.12); color:#fff;}
.chip .cd{width:8px;height:8px;border-radius:2px; flex:none;}
.dnav{display:flex; gap:8px; margin-top:20px;}
.dnav button{flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text); font-size:13px; cursor:pointer; transition:.15s;}
.dnav button:hover{background:rgba(255,255,255,.1);}
.dnav button.primary{background:linear-gradient(90deg,#1d3a6b,#123); border-color:rgba(110,168,254,.4); color:#cfe0ff; font-weight:600;}
.dnav button:disabled{opacity:.3; cursor:default;}
.dmod{padding:2px 0;}
.dmod .dh{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.dmod .dh .big{width:46px;height:46px;border-radius:12px; display:grid; place-items:center; font-size:22px;}
.dmod .dh h2{font-size:18px;}
.dmod .dh small{color:var(--muted); font-size:11.5px; display:block; margin-top:2px;}
.member{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:10px; cursor:pointer; font-size:13px; color:var(--muted); border:1px solid transparent; transition:.15s;}
.member:hover{background:rgba(255,255,255,.05); color:var(--text); border-color:var(--line);}
.member .no{font-size:10px; color:var(--dim); width:18px; font-variant-numeric:tabular-nums;}
/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}
@media (max-width:1180px){ #right{position:absolute; right:0; top:0; bottom:0; z-index:40; box-shadow:-10px 0 30px rgba(0,0,0,.4);} #left{width:220px; min-width:220px;} }
@media (max-width:900px){ #left{display:none;} .brand small{display:none;} }

/* lite highlight */
#graph svg.lite .node:not(.keep){opacity:.14; transition:opacity .2s;}
#graph svg.lite .edge:not(.keep){opacity:.04; transition:opacity .2s;}
#graph svg.lite .node.selected{opacity:1;}
.node.selected .halo{opacity:1; stroke-width:2;}
.node.selected .ball{stroke-width:3;}
.node.done .ball{stroke:#3ecf8e; fill:rgba(62,207,142,.16);}
.node .checkmark{opacity:0;}
.node.done .checkmark{opacity:1;}
#graph svg.hide-m0 .mod-m0,#graph svg.hide-m0 .e-m0{opacity:.05;}
#graph svg.hide-m1 .mod-m1,#graph svg.hide-m1 .e-m1{opacity:.05;}
#graph svg.hide-m2 .mod-m2,#graph svg.hide-m2 .e-m2{opacity:.05;}
#graph svg.hide-m3 .mod-m3,#graph svg.hide-m3 .e-m3{opacity:.05;}
#graph svg.hide-m4 .mod-m4,#graph svg.hide-m4 .e-m4{opacity:.05;}
#graph svg.hide-m5 .mod-m5,#graph svg.hide-m5 .e-m5{opacity:.05;}
#graph svg.hide-m6 .mod-m6,#graph svg.hide-m6 .e-m6{opacity:.05;}

/* ---------- 深度讲解 / 算例 / 自测 ---------- */
details.deep{background:rgba(110,168,254,.06); border:1px solid rgba(110,168,254,.22); border-radius:12px; padding:0; margin-bottom:14px; overflow:hidden;}
details.deep summary{list-style:none; cursor:pointer; padding:10px 14px; font-size:13px; font-weight:700; color:#cfe0ff; display:flex; align-items:center; gap:8px;}
details.deep summary::-webkit-details-marker{display:none;}
details.deep summary::before{content:"▶"; font-size:9px; transition:.2s; color:var(--accent);}
details.deep[open] summary::before{transform:rotate(90deg);}
details.deep .deepbody{padding:2px 14px 12px; font-size:13px; line-height:1.85; color:#d6deee;}
details.deep .deepbody p{margin-bottom:10px;}
details.deep .deepbody .hl{color:#ffd479;}
.example{background:rgba(62,207,142,.06); border-left:3px solid var(--c2); border-radius:8px; padding:10px 13px; margin:0 0 14px; font-size:12.8px; line-height:1.75; color:#cfe9dc; white-space:pre-wrap;}
.example b{color:#7ce8b5;}
.quizbox{border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:14px; background:rgba(255,255,255,.02);}
.quizq{font-size:13.5px; font-weight:600; margin-bottom:10px; line-height:1.6;}
.quizopt{display:block; width:100%; text-align:left; background:rgba(255,255,255,.04); border:1px solid var(--line); color:#d6deee;
  border-radius:9px; padding:8px 12px; margin-bottom:7px; font-size:12.8px; cursor:pointer; transition:.15s; line-height:1.5;}
.quizopt:hover:not(:disabled){border-color:rgba(110,168,254,.5); background:rgba(110,168,254,.1);}
.quizopt:disabled{cursor:default;}
.quizopt.correct{border-color:var(--ok); background:rgba(62,207,142,.14); color:#bff2d8;}
.quizopt.wrong{border-color:#f87171; background:rgba(248,113,113,.12); color:#ffd0d0;}
.quizwhy{margin-top:8px; font-size:12.2px; color:#ffd479; line-height:1.65; display:none;}
.quizwhy.show{display:block;}
#graph svg.hide-m7 .mod-m7,#graph svg.hide-m7 .e-m7{opacity:.05;}

/* ========== 亮色主题（默认 · 暖黄） ========== */
html[data-theme="light"]{
  --bg:#f6f1e2; --text:#323a48; --muted:#5c6878; --dim:#98a1b0;
  --accent:#2f6bd8; --ok:#1f9d62; --line:rgba(120,104,64,.24);
}
html[data-theme="light"] body{ background:radial-gradient(1200px 800px at 70% -10%, #fdeec6 0%, #f6f1e2 60%) #f6f1e2; color:#323a48; }
html[data-theme="light"] header{ background:rgba(255,251,240,.9); }
html[data-theme="light"] .searchwrap input{ background:rgba(255,255,255,.85); color:#323a48; border-color:rgba(120,104,64,.3); }
html[data-theme="light"] .searchwrap input:focus{ background:#fff; }
html[data-theme="light"] #left, html[data-theme="light"] #right{ background:rgba(255,252,243,.75); }
html[data-theme="light"] .progressbar{ background:rgba(0,0,0,.12); }
html[data-theme="light"] .hbtn{ color:#5c6878; }
html[data-theme="light"] .hbtn:hover{ color:#323a48; border-color:rgba(120,104,64,.4); }
html[data-theme="light"] .pmod{ background:rgba(255,255,255,.7); }
html[data-theme="light"] .pitem:hover{ background:rgba(60,70,100,.08); color:#323a48; }
html[data-theme="light"] .pitem.active{ background:rgba(47,107,216,.16); }
html[data-theme="light"] .pitem .ck{ border-color:rgba(60,70,100,.4); }
html[data-theme="light"] .node text.lbl{ fill:#4a5670; }
html[data-theme="light"] .edge{ stroke:rgba(70,90,130,.45); }
html[data-theme="light"] .edge.rel{ stroke:rgba(70,90,130,.28); }
html[data-theme="light"] .edge.belong{ stroke:rgba(70,90,130,.14); }
html[data-theme="light"] .legend, html[data-theme="light"] .hint{ background:rgba(255,253,246,.94); }
html[data-theme="light"] .legend .lgt{ color:#5c6878; }
html[data-theme="light"] .edgelegend i{ border-top-color:rgba(70,90,130,.5); }
html[data-theme="light"] .edgelegend i.dashed{ border-top-color:rgba(70,90,130,.3); }
html[data-theme="light"] .dlist li{ color:#3d4757; }
html[data-theme="light"] details.deep{ background:rgba(47,107,216,.07); border-color:rgba(47,107,216,.28); }
html[data-theme="light"] details.deep summary{ color:#1d4fae; }
html[data-theme="light"] details.deep .deepbody{ color:#3d4757; }
html[data-theme="light"] details.deep .deepbody .hl{ color:#a16207; }
html[data-theme="light"] .example{ background:rgba(31,157,98,.07); border-left-color:#1f9d62; color:#2c5a45; }
html[data-theme="light"] .example b{ color:#0e7a49; }
html[data-theme="light"] .quizbox{ background:rgba(255,255,255,.65); }
html[data-theme="light"] .quizopt{ background:#fff; color:#3d4757; }
html[data-theme="light"] .quizopt:hover:not(:disabled){ background:#eef3ff; }
html[data-theme="light"] .quizopt.correct{ color:#0e7a49; background:rgba(31,157,98,.15); }
html[data-theme="light"] .quizopt.wrong{ color:#b33636; background:rgba(220,80,80,.13); }
html[data-theme="light"] .quizwhy{ color:#8a6d1a; }
html[data-theme="light"] .chip{ background:rgba(255,255,255,.8); color:#3d4757; }
html[data-theme="light"] .chip:hover{ color:#1d4fae; }
html[data-theme="light"] .dnav button{ background:rgba(255,255,255,.75); }
html[data-theme="light"] .member:hover{ background:rgba(60,70,100,.07); }
html[data-theme="light"] ::-webkit-scrollbar-thumb{ background:rgba(60,70,100,.3); }
html[data-theme="light"] .brand .logo{ background:linear-gradient(135deg,#f5d77a,#eda93c); }
html[data-theme="light"] .empty-state{ color:#98a1b0; }
html[data-theme="light"] .node .ball{ stroke-width:1.8; }
body, header, #left, #right, .pmod, .chip, .quizopt, .hbtn{ transition:background .3s, color .3s, border-color .3s; }

/* ========== 连线优化 ========== */
.edge{ fill:none; stroke-linecap:round; }
.edge.pre{ stroke-width:1.7; }
html[data-theme="dark"] .edge.pre{ stroke:rgba(255,255,255,.45); }
html[data-theme="light"] .edge.pre{ stroke:rgba(80,100,140,.62); }
html[data-theme="dark"] .edge.rel{ stroke:rgba(255,255,255,.2); stroke-width:1.05; }
html[data-theme="light"] .edge.rel{ stroke:rgba(80,100,140,.3); stroke-width:1.05; }
html[data-theme="dark"] .edge.belong{ stroke:rgba(255,255,255,.09); stroke-width:.9; }
html[data-theme="light"] .edge.belong{ stroke:rgba(80,100,140,.17); stroke-width:.9; }
/* 过滤按钮：隐藏某类线 */
#graph svg.hide-pre .edge.pre:not(.keep){ opacity:0 !important; }
#graph svg.hide-rel .edge.rel:not(.keep){ opacity:0 !important; }
#graph svg.hide-belong .edge.belong:not(.keep){ opacity:0 !important; }
.edgelegend i.pre{ border-top:2px solid; }
.edgelegend i.belong{ border-top:1px solid; opacity:.55; }
.edgefilters{ display:inline-flex; gap:6px; margin-left:4px; }
.fbtn{ background:transparent; border:1px solid var(--line); color:var(--muted); font-size:11px; border-radius:14px; padding:2px 10px; cursor:pointer; transition:.15s; }
.fbtn:hover{ color:var(--text); border-color:var(--accent); }
.fbtn.off{ opacity:.35; text-decoration:line-through; }
html[data-theme="light"] .fbtn{ color:#5c6878; }

/* 3D 模式 */
.modebar{ position:absolute; top:10px; left:10px; z-index:30; display:flex; gap:8px; }
.modebar .hbtn{ background:var(--floatBg); border:1px solid var(--line); color:var(--muted); }
.modebar .hbtn:hover{ color:var(--text); border-color:var(--accent); }
.modebar .hbtn.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
#cv3d{ display:block; touch-action:none; }

/* 右侧栏收起 + 可拖动分隔条 */
#right.closed{ border-left-width:0; padding:0; overflow:hidden; }
body.right-open #resizer{ display:block; }
#resizer{ display:none; position:absolute; top:0; bottom:0; right:-7px; width:14px; cursor:col-resize; z-index:36; }
#resizer::after{ content:""; position:absolute; left:50%; top:0; bottom:0; width:3px; transform:translateX(-50%); border-radius:2px; transition:background .2s; background:transparent; }
#resizer:hover::after, body.resizing #resizer::after{ background:var(--accent); opacity:.65; }
body.resizing{ cursor:col-resize; user-select:none; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🧭</div>
    <div><h1>股海导航</h1><small>系统学习炒股 · 交互式知识图谱</small></div>
  </div>
  <div class="searchwrap"><span class="si">🔍</span><input id="search" type="text" placeholder="搜索知识点，如：市盈率 / 止损 / MACD" autocomplete="off"></div>
  <div class="hstats">
    <span>进度 <b id="pct" style="color:var(--text)">0%</b> <span id="doneNum">(0/47)</span></span>
    <div class="progressbar"><i id="pbar"></i></div>
    <button class="hbtn" id="themeBtn">☀️ 亮色</button>
    <button class="hbtn" id="resetBtn">重置进度</button>
  </div>
</header>
<div id="app">
  <aside id="left">

    points:["指数基金成本低、天然分散、无选股与择时风险，长期年化约 8–10%（历史区间，不保证未来）。","巴菲特十年赌约：标普500 指数战胜了华尔街顶尖主动基金组合。","把指数当作基准：你的任何主动策略都要能跑赢它，否则不如直接买指数。","指数投资还解决了大部分行为问题：不用盯盘、不会追涨杀跌。","先建立指数仓位作为锚，再用亏得起的钱小仓位验证主动能力。"],
    myths:["“指数涨太慢、没意思”——多数人连指数都跑不赢。","“现在点位高不能买”——长期投资者靠定投与持有穿越周期。"],
    actions:["开设一个指数基金定投，把它当作你的“对照实验组”。","记录：我的主动操作一年后跑赢它了吗？差距就是能力的真实度量。"],
    quiz:[{q:"指数基金长期跑赢多数主动基金，最核心的原因？",opts:["指数波动更小","基金经理水平差","成本低 + 不付选股税 + 自动优胜劣汰","指数有内幕"],ans:2,why:"指数不付“选股税”，费率低，且每年自动剔除坏公司。对多数人而言，指数是期望值最高的选择。"},{"q": "巴菲特十年赌约中，跑赢华尔街主动基金组合的是？", "opts": ["黄金","标普500 指数基金","对冲基金冠军","美国国债"], "ans": 1, "why": "2007–2017 标普500 指数完胜主动基金组合，证明低成本被动投资的长期优势。"},{"q": "指数基金“自动优胜劣汰”体现在？", "opts": ["定期剔除差公司、纳入好公司","基金经理每天精选个股","只买不卖","靠内部消息调仓"], "ans": 0, "why": "指数编制规则定期调整成分股，等于免费执行“留下强者、踢走弱者”。"}],

  "m0d":{id:"m0d", mod:"m0", icon:"⚖️", title:"期望值与赔率",
    summary:"投资的本质是下注：期望 = 胜率×平均盈利 − 败率×平均亏损 − 成本。先算赔率再出手；亏多少比赚多少更重要，因为亏损是不对称的。",
    deep:"把每笔交易当作一次可重复的赌局：期望 = 胜率×平均盈利 − 败率×平均亏损 − 成本。散户最常犯的错是只盯胜率：“我十次对八次”却仍亏钱——因为对的时候赚 1%，错的时候亏 15%。先算赔率再出手。另外记住亏损的不对称：-50% 需要 +100% 回本，所以“控制单笔亏损”的数学优先级高于“追求收益”。",
    example:"例：策略 A：胜率 80%，平均盈利 5%，平均亏损 30% → 期望 = 0.8×5 − 0.2×30 = −2%（负期望，高胜率也亏）。策略 B：胜率 40%，平均盈利 20%，平均亏损 8% → 期望 = 0.4×20 − 0.6×8 = +3.2%（正期望，胜率不高也能赚）。",
    points:["期望公式：即使胜率只有 40%，只要平均盈利是平均亏损的 2 倍，期望仍为正。","“错了亏多少、对了赚多少”必须在买入前想清楚，这就是赔率思维。","亏损的不对称：-50% 需要 +100% 才能回本。所以“少亏”的数学优先级高于“多赚”。","没有正期望的把握时，持有现金也是一种仓位，不交易可以是对的。","胜率、赔率、成本三者都要估计，任何一个离谱，期望就可能为负。"],
    myths:["“胜率高=能赚钱”：忽略了赔率与成本。","“亏一点没事，涨回来就好”：没有止损纪律，小亏会滚成大亏。"],
    actions:["每笔交易前写下：预期胜率、止盈位、止损位，套入公式算期望。","如果算不出正期望，这笔交易就不该做。"],
    quiz:[{q:"一笔交易期望为正的充要条件是？",opts:["赔率必须大于 2","从不亏损","胜率高于 50%","胜率×平均盈利 > 败率×平均亏损 + 成本"],ans:3,why:"期望 = 胜率×平均盈利 − 败率×平均亏损 − 成本，为正才值得下注。胜率高但赔率差，期望照样为负。"},{"q": "某策略胜率60%、平均盈利10%、平均亏损15%，它的期望值是？", "opts": ["无法计算","正的","零","负的"], "ans": 2, "why": "期望=0.6×10%−0.4×15%=0。胜率虽高，赔率差，长期不赚不亏（还没算成本）。"},{"q": "为什么“不交易”有时是正确选择？", "opts": ["现金永远不亏，就该永远空仓","没有正期望时，持有现金能避免负期望损耗","手续费会被免除","别人都空仓"], "ans": 1, "why": "当所有可选项的期望都不为正时，现金（0期望、0损耗）就是最优解。"}],
    related:["m4c","m5b","m5a","m5e","m0g","m0h"]},
  "m0e":{id:"m0e", mod:"m0", icon:"🧾", title:"交易成本",
    summary:"每次交易都有成本：佣金、印花税、滑点、买卖价差。高频交易在扣成本后是负和游戏——成本是散户最确定、最常被忽略的“敌人”。",
    deep:"成本有四层：佣金（约万 2.5 起、最低 5 元）、印花税（A股卖出时 0.05%）、滑点（市价单的实际成交价差）、买卖价差。A股单边合计约 0.1%–0.2%。把频率乘上去，一年 100 次交易 = 成本 10%–20%+，绝大多数策略的毛利都喂给了市场。这就是“少交易、长持有”不只是性格偏好、而是数学结论的原因。",
    example:"例：10 万本金，单边成本 0.15%（含滑点），一年交易 50 次（25 买+25 卖）→ 年成本 ≈ 10万 × 0.15% × 50 = 7500 元 = 本金的 7.5%。你得先赚 7.5% 才刚回本，再谈盈利。",
    points:["A股成本构成：佣金（约万2.5 起，最低5元）+ 印花税（卖出时，2023年8月后为 0.05%）+ 过户费；ETF 无印花税。","港股有印花税与较高佣金；美股佣金低，但注意汇率与预扣税。","滑点：实际成交价与你的预期价的差，市价单尤其明显。","简单估算：A股单边成本约 0.1–0.2%，一年交易 50 次，成本就是几个点。","结论：交易越少、持有越久，成本占比越低——这不仅是性格偏好，更是数学结果。"],
    myths:["只算佣金、不算滑点与印花税。","“手续费是小钱”：复利计算下，高频交易的成本会吃掉大部分超额收益。"],
    actions:["统计自己过去一年的交易成本总额，算它占本金与收益的比例。","把“降低交易频率”作为一项明确的规则写进交易系统。"],
    quiz:[{q:"扣除交易成本后，高频短线交易本质上是？",opts:["负和游戏","无法判断","正和游戏","零和游戏"],ans:0,why:"短线交易者之间是零和（我赚即你亏），扣掉佣金、印花税、滑点后整体是负和——所以频繁交易长期必输，除非你有真实优势。"},{"q": "A股卖出时的印花税（2023年8月后）约为？", "opts": ["0.5%","1%","0.1%","0.05%"], "ans": 3, "why": "印花税由 0.1% 降至 0.05%，且仅卖出时收取；ETF 免印花税。"},{"q": "以下哪一项属于“隐性成本”？", "opts": ["券商佣金","过户费","滑点与买卖价差","印花税"], "ans": 2, "why": "佣金/印花税/过户费是明码标价的显性成本；滑点与价差藏在实际成交价里，最容易被忽略。"}],
    related:["m1c","m6c","m0d","m4b"]},
  "m0f":{id:"m0f", mod:"m0", icon:"🧠", title:"行为金融学",
    summary:"散户亏损的第一大原因不是知识不足，而是人性：损失厌恶、处置效应、过度自信、确认偏误、从众与锚定。规则化是唯一可靠的解药。",
    deep:"亏损第一原因不是知识，是人性。损失厌恶让你“割盈利、扛亏损”；处置效应让你过早卖赢家、死拿输家；过度自信让你连续成功后加杠杆；确认偏误让你只看想看的信息；锚定让你被买入价绑架。解药不是“心态好”（心态是流程的结果），而是把决策规则化：买卖条件写成清单、减少盘中看盘、亏损后强制休息。",
    example:"例：你 10 元买入，现价 8 元。换个问法：“如果我现在空仓，会以 8 元买入吗？”——不会，就该卖。“锚定”却让你死等回到 10 元解套。把参照系从“买入价”换成“当前决策”，很多纠结立刻消失。",
    points:["损失厌恶：亏 100 的痛苦约等于赚 200 的快乐 → 导致拿不住盈利、死扛亏损。","处置效应：过早卖掉上涨的股票，却长期持有下跌的股票。","过度自信：连续几次成功就加杠杆、加仓位，把运气当能力。","确认偏误：只找支持自己判断的信息，忽略反面证据。","锚定：被买入价或历史高点锚住，影响“现在该不该走”的判断。","解药：把决策规则化、写下来、减少盘中盯盘、用清单决策。"],
    myths:["“我能控制情绪”——研究反复证明，偏差在压力下会自动出现，与智商无关。","“这次不一样”——每一次泡沫里的经典台词。"],
    actions:["建立交易日志，每次记录当时的情绪状态，复盘时对照这份清单。","给自己设一条熔断规则：单月亏损 X% 强制停手一周。"],
    quiz:[{q:"“处置效应”指的是？",opts:["越涨越买、追高","过早卖出盈利股、死扛亏损股","频繁换股","抄底越跌越买"],ans:1,why:"处置效应 = 拿不住盈利（落袋为安心理）却死守亏损（损失厌恶）。这两种偏差组合，长期把好仓位换成坏仓位。"},{"q": "损失厌恶最直接会导致哪种行为？", "opts": ["死扛亏损、早卖盈利（割盈扛亏）","越跌越加杠杆","只买不卖","频繁换股"], "ans": 0, "why": "亏100的痛苦≈赚200的快乐，让人拿不住盈利、舍不得止损，形成“处置效应”。"},{"q": "“锚定”偏差指的是？", "opts": ["总在最高点买入","只信新闻标题","从不看价格","被买入价或历史高点绑架了“现在该不该卖”的判断"], "ans": 3, "why": "锚定让你拿“10元买的”当参照系，而不是“现在 8 元是否值得持有/买入”。"}],

  "m0g":{id:"m0g", mod:"m0", icon:"⏳", title:"复利与时间",
    summary:"复利常被称为“世界第八大奇迹”：时间越长，复利效应越惊人；反过来，一次大亏损对复利的破坏也越致命。这是理解长期投资的第一性原理。",
    deep:"复利是指数增长，而人的直觉是线性的。收益端：长期持有、少折腾、让盈利再投资，每一块钱工作的时间越长，滚得越大。损失端：一次 -50% 需要 +100% 回本，一次大亏能抹掉多年积累。散户常犯的错是把复利当口号，行为却不断打断它：赚了就跑、亏了死扛、频繁交易交手续费。真正的复利，靠的是“可持续的正期望 + 不中断”。",
    example:"例：同样 10 万元。甲年化 12%，20 年后约 96 万；乙年化 8%，20 年后约 47 万——每年只差 4 个点，20 年差一倍多。再算“折腾税”：丙每年先赚 30% 再亏 20% 交替（看起来很猛），10 年下来年化约 3.5%，远低于直觉。少折腾就是复利。",
    points:["复利公式：终值 = 本金 × (1+年化收益率)^年数。收益率差一点，长期差很多。","例：10% 年化 30 年 ≈ 17 倍；20% 年化 30 年 ≈ 237 倍——相差 13 倍。","72 法则：年化 8%，约 9 年翻倍；年化 12%，约 6 年翻倍。","通胀是隐形敌人：年化 3% 的通胀，约 24 年购买力减半。","亏损不对称是复利的逆刃：-50% 需要 +100% 回本，先保证不亏大钱。","复利的前提是不中断：反复归零，等于亲手打断复利。"],
    myths:["“复利就是存钱”：复利的前提是可持续的正收益，赌一把归零就全没了。","“趁年轻梭哈一把，赢了再慢慢复利”：本金归零后，复利从零开始。"],
    actions:["用 72 法则算：按你预期的年化收益，多少年翻倍。","把“永不归零（单笔风险上限）”写进你的第一原则。"],
    quiz:[{q:"72 法则：年化收益 8%，本金约多少年翻倍？",opts:["18 年","6 年","9 年","12 年"],ans:2,why:"72 ÷ 8 = 9，约 9 年翻倍。72 法则是粗略估算复利翻倍时间的速算法。"},{"q": "年化10%与年化5%相比，30年后本金约相差多少倍？", "opts": ["约2倍","约4倍","约8倍","一样"], "ans": 1, "why": "1.1^30≈17.4，1.05^30≈4.3，差约4倍。每年差5个点，30年差4倍——这就是复利的时间威力。"},{"q": "复利最怕被什么打断？", "opts": ["一次归零式大亏和频繁折腾","正常的短期回调","定期分红","偶尔浮亏"], "ans": 0, "why": "复利=可持续正收益+不中断。-50% 需 +100% 回本，归零一次，时间全部重来。"}],
    related:["m0d","m0c","m5e","m7f","m0h"]},
  "m0h":{id:"m0h", mod:"m0", icon:"🏰", title:"案例：门口的野蛮人——杠杆收购",
    summary:"1988 年 KKR 以约 250 亿美元收购 RJR Nabisco——史上最著名的杠杆收购（LBO），被写成《门口的野蛮人》。它是一堂浓缩的金融课：杠杆、现金流、估值、贪婪与“赢者的诅咒”全在里面。",
    deep:"故事：RJR 的 CEO 约翰逊想用公司的钱低价把自己买下来（MBO 占便宜）→ 消息走漏引发公开竞价 → KKR 以每股 109 美元、总价约 250 亿美元险胜（只比对手高 1 美元）→ 为还债疯狂卖资产 → 1990 年垃圾债券市场崩盘，KKR 被巨额债务拖累，回报远低于预期。续集：2007 年 KKR+TPG+高盛以约 450 亿美元收购德州电力 TXU（史上最大 LBO），押注天然气价格，2014 年破产。两案合起来是最好的“杠杆风险”教材。",
    example:"算例：买一家公司 100 亿，自己出 20 亿、借 80 亿；3 年后卖 120 亿并用现金流还掉 30 亿债 → 股权 = 120−50 = 70 亿，投入 20 亿 = 3.5 倍。若全用自有资金买，只有 1.2 倍——杠杆放大收益。反面：若只卖 60 亿且债务还剩 70 亿 → 资不抵债，股权归零。上行放大、下行毁灭，且不对称。",
    points:["LBO = 借别人的钱买公司，用公司自己的现金流还债；收购方只出 10%–40% 的股权。","RJR 1988：CEO 想低价 MBO 占便宜 → 公开竞价 → KKR 每股 109 美元、总价约 250 亿美元险胜。","KKR 赢下拍卖却回报平平：出价过高（赢者的诅咒）+ 债务压顶 + 1990 年垃圾债市场崩盘。","TXU 2007：约 450 亿美元押注天然气价格 → 气价暴跌 → 2014 年破产，史上最大 LBO 以最大破产收场。","杠杆不创造价值，只放大结果：放大的是“经营改善”和“假设正确”，也放大“出价过高”和“假设错误”。","对散户的启示：现金流质量 > 账面利润；绝不借钱/配资炒股；警惕贪婪与过度自信。"],
    myths:["“杠杆收购=空手套白狼稳赚”：杠杆不创造价值，假设错了就归零（TXU 即证）。","“故事里赢家赚最多”：KKR 赢了拍卖，回报却远低于预期——赢者的诅咒。"],
    actions:["用两句话写：这个案例如何印证“亏损不对称”与“行为金融学”。","检查自己：是否在使用任何形式的杠杆（融资、配资、借钱炒股）？有就立刻停。"],

  "m0i":{id:"m0i", mod:"m0", icon:"🌷", title:"案例：荷兰郁金香泡沫",
    summary:"1636–1637 年荷兰：一株稀有郁金香球茎的价格一度超过阿姆斯特丹一栋豪宅，几个月后暴跌 99% 以上。人类历史上第一次有记录的投机泡沫，也是“博傻理论”最纯粹的样本。",
    deep:"背景：郁金香 16 世纪从奥斯曼传入欧洲，稀有品种被贵族追捧；1634 年起投机升级，普通人涌入，甚至出现“还没开花就转手多次”的期货式交易。1637 年 2 月一场拍卖无人接盘，价格雪崩，一年内涨了几十倍的东西几个月内一文不值。最本质的驱动是博傻：买家明知价格脱离价值，只赌有更傻的人接盘——链条一断，全部归零。任何资产一旦买入理由变成“还会涨、有人接盘”而不是“它值这个价”，泡沫就开始了。",
    example:"例：1637 年一株“永远的奥古斯都”郁金香球茎的最高喊价，相当于当时阿姆斯特丹运河边一栋豪宅；几个月后球茎几乎免费。换算到今天，就像用一套房换一个“限量款球鞋购买凭证”，然后凭证归零。",
    points:["历史：1634–1637 荷兰，稀有郁金香球茎价格暴涨几十倍后崩盘 99%+。","机制：纯投机 + 期货式转手 + 博傻接盘，价格完全脱离使用价值。","“这次不一样”的最早版本：当时人们相信郁金香会永远涨。","启示：脱离内在价值的暴涨必然均值回归，但没人知道“何时”。","与现代同构：加密货币、MEME 股、NFT 等泡沫都是同一剧本。","对个人：买入理由写成“还会涨/有人接盘”时，就是离场信号。"],
    myths:["“稀缺=值钱”：稀缺只支撑价格、不支撑价值；没有现金流与用途，稀缺品随时归零。","“高价还有人买=还会涨”：博傻游戏必然有人接最后一棒，别赌不是你。"],
    actions:["把“我买入的理由”写下来——如果答案是“还会涨/有人接盘”，停下来。","对比 2020–2021 的 MEME 股/币圈，找出与郁金香的共同点。"],
    quiz:[{q:"郁金香泡沫最本质的驱动是？",opts:["博傻——赌有人以更高价接盘","政府恶意操纵","天气影响产量","郁金香真的有观赏价值"],ans:0,why:"价格完全脱离价值，买家靠“更傻的人接盘”赚钱，链条一旦断裂就崩盘。博傻是郁金香与现代币圈共通的本质。"},{"q": "“博傻理论”描述的是哪种心态？", "opts": ["跟着庄家走","长期持有等价值回归","买便宜的好东西等它升值","明知价格荒谬，仍赌有更傻的人接盘"], "ans": 3, "why": "郁金香与现代泡沫共通的本质：买家不关心价值，只赌下一个接盘者出更高价。"},{"q": "郁金香泡沫给现代投资者最直接的提醒是？", "opts": ["泡沫里早跑就能稳赚","买稀缺收藏品一定安全","价格脱离内在价值的暴涨不可持续","稀有品永远保值增值"], "ans": 2, "why": "稀缺只支撑价格不支撑价值。没有现金流与用途支撑的暴涨，终会均值回归甚至归零。"}],

  "m0j":{id:"m0j", mod:"m0", icon:"🗾", title:"案例：日本泡沫经济",
    summary:"1985 年广场协议后日元升值 + 连续降息 → 信贷狂潮 → 股市与地价暴涨：日经225 于 1989 年底见顶 38957 点，市盈率高达 60–80 倍；随后崩盘，日本陷入“失去的三十年”。",
    deep:"链条：1985 年广场协议日元大幅升值，为对冲通缩压力日本央行连续降息 → 热钱涌入股市楼市，企业与个人大规模加杠杆 → 日经225 从约 1.3 万点涨到 1989 年 12 月 29 日的 38957 点（市盈率 60–80 倍），东京地价号称“卖掉东京可买下整个美国”。1990 年央行急转加息，泡沫破裂：日经 3 年跌约 60%，地价连跌约 20 年；企业资产缩水后进入“资产负债表衰退”——不借钱、只还债，经济长期低迷。教训：①货币宽松 + 信贷扩张是泡沫燃料；②60–80 倍的市盈率是荒谬的信号；③高杠杆买房买股的人在破裂时最先被清算；④“东京永不跌”是最贵的一句话。",
    example:"例：1989 年底日本土地资产总值约为美国土地总值的 4 倍——一个面积只有美国约 1/25 的国家。破裂后，东京写字楼价格一度跌去 80% 以上；用 3 倍杠杆在顶部买房的人，本金早已归零还倒欠银行。",
    points:["导火索：广场协议(1985)→日元升值→连续降息→信贷扩张。","顶峰：1989-12-29 日经 38957 点，市盈率 60–80 倍，地价天文数字。","破裂：1990 年加息，日经 3 年跌约 60%，地价跌约 20 年。","深层后果：资产负债表衰退，企业从借钱扩张转向还债收缩→失去的三十年。","教训：宽松信贷 + 高杠杆 + 估值荒谬 +“这次不一样”= 泡沫配方。","个人教训：别用高杠杆赌资产“只涨不跌”。"],
    myths:["“日本是特例，不会重演”：2008 美国次贷、2021 中概/币圈都有相似剧本。","“央行能精准刺破泡沫而不伤经济”：日本央行加息过晚且过猛，说明“烫平”极难。"],
    actions:["查一下日经225 从 1989 年高点到现在的位置，体会“30 年回本难”。","用“如果跌 60% 我扛得住吗”检验自己的杠杆与仓位。"],
    quiz:[{q:"日本泡沫破裂后经济长期低迷，关键机制是？",opts:["日本人变懒了","资产负债表衰退——从借钱扩张转向还债收缩","政府完全不管","日元大幅贬值"],ans:1,why:"资产价格暴跌使企业资产负债表受损，企业优先还债而非投资，货币宽松也传导不畅——这就是“失去的三十年”的核心机制。"},{"q": "日本泡沫顶峰时，日经225的市盈率大约是多少？", "opts": ["60–80倍","150倍以上","10–15倍","20–30倍"], "ans": 0, "why": "1989年顶峰市盈率高达60–80倍，远超合理区间，是泡沫最刺眼的估值信号。"},{"q": "日本泡沫对个人最大的教训是？", "opts": ["买房在任何时候都绝对安全","日元会一直升值","政府一定会救个人","别用高杠杆赌“资产只涨不跌”"], "ans": 3, "why": "1980年代全民加杠杆买房买股，破裂时最先被清算的就是高杠杆者。"}],

  "m0k":{id:"m0k", mod:"m0", icon:"🏦", title:"案例：2008 金融危机",

    deep:"链条：低利率 → 全民买房 → 银行把次级房贷打包成 MBS/CDO 卖给全球投资者（评级机构还给了 AAA）→ 房价下跌 → 次贷违约 → 持有者巨亏（雷曼、AIG）→ 2008 年 9 月 15 日雷曼破产 → 全球信用冻结 → 股市暴跌（标普500 自 2007 年高点最大回撤约 57%）→ 各国救市。三大本质：①把高风险资产包装成“高评级”卖给不懂的人（信息不对称）；②金融机构用极高杠杆，损失被放大到无法承受；③金融产品把风险传导到全球——你以为分散了，其实所有人持有的是同一批违约房贷。对个人的教训：看不懂的产品不买、控制杠杆、留足现金与债券缓冲；危机同时是机会——恐慌时优质资产打折（巴菲特 2008 年抄底）。",

    actions:["把“看不懂的产品不买”写进自己的规则。","检查持仓：有没有“包装复杂、说不清底层资产”的产品？"],

  /* ---------- 模块1：基础认知 ---------- */
  "m1a":{id:"m1a", mod:"m1", icon:"📜", title:"股票的本质",
    summary:"股票代表公司所有权的一部分。你买的不是一串代码，而是一笔未来现金流的索取权：公司赚钱你分享（分红与成长），公司亏钱你承担。",
    deep:"一股 = 公司的一部分，回报来自公司赚的钱（盈利增长 + 分红），这是正和游戏。对比彩票：彩票的期望必然为负（发行方抽水）。买股票如果只看代码不看公司，就等于把正和游戏玩成负和。长期统计（美股 100 多年）：股票年化约 6%–7%（扣除通胀后约 4%–5%），远超债券，代价是波动大——所以股票要“拿得住”，拿不住的人享受不到风险溢价。",
    example:"例：你花 1 万元买某公司股票，等于出资 1 万元入股。公司每年赚 10% 净利并分红，你分到钱；公司亏损，你的股份跟着缩水。这就是“所有权”，不是赌大小。买之前先问：我愿意成为这家公司的股东吗？",
    points:["一股 = 公司的一小份所有权：收益来自盈利增长与分红。","长期看，股价与盈利高度相关：盈利涨 10 倍，估值不变时股价也趋向涨 10 倍。","股权 vs 债券：股权无固定回报、风险更高，所以长期要求更高的回报（风险溢价）。","股票 ≠ 彩票：买之前先回答“这家公司靠什么赚钱”。","市场短期是投票机（情绪），长期是称重机（盈利）——格雷厄姆。"],
    myths:["把股票当代码、当筹码，只盯图形不研究公司。","“好公司股价就会一直涨”：好公司还要好价格。"],
    actions:["对每只持仓，用一句话写出它的商业模式：谁付钱、为什么付钱、凭什么持续。","读一家公司最近一份年报的“致股东信”。"],
    quiz:[{q:"股票长期回报的主要来源是？",opts:["K线形态","内幕消息","庄家抬轿","企业盈利增长与分红"],ans:3,why:"股票是所有权凭证，长期回报来自企业创造的价值（盈利+分红）。这是正和游戏；靠别人抬轿是零和/负和。"},{"q": "长期看，股票回报高于债券，主要是因为？", "opts": ["股票波动更小","股票免税","股票有“风险溢价”作为承担波动的补偿","政府补贴股票"], "ans": 2, "why": "股权无固定回报、风险更高，市场因此要求更高的长期回报——这是风险溢价的本质。"},{"q": "“短期是投票机，长期是称重机”说明？", "opts": ["两者都看消息","短期情绪主导、长期盈利主导","短期看盈利，长期看情绪","两者都看情绪"], "ans": 1, "why": "短期价格被情绪与资金推动，长期被企业真实盈利“称”出价值。"}],

  "m1b":{id:"m1b", mod:"m1", icon:"🌏", title:"市场与板块",
    summary:"A股、港股、美股规则差异很大；主板、创业板、科创板、北交所定位不同，风险与门槛也不同。先搞清楚你在哪个“球场”上。",
    deep:"不同市场规则差异巨大：A股 T+1、有涨跌停、散户主导 → 波动结构不同；港股 T+0、无涨跌停、机构主导；美股 T+0、有熔断。板块门槛：主板无特别门槛；创业板需 2 年经验 + 10 万；科创板 2 年 + 50 万；北交所 2 年 + 50 万（30% 涨跌停）。别用 A 股的打法直接套港美股，也别被“20% 涨跌停=赚得快”误导——波动是双刃剑。",
    example:"例：同一家公司，在 A 股一天最多 10%（主板），在港股可能单日暴涨 50% 或暴跌 40%，在美股可能有熔断暂停。同样的消息，不同规则下你的风险敞口完全不同。",
    points:["A股：T+1、有涨跌停（主板10%、创业/科创20%、北交所30%、ST 5%）、以散户为主。","港股：T+0、无涨跌停、可做空、机构为主；美股：T+0、无涨跌停但有熔断（7%/13%/20%）。","交易时间：A股 9:30–11:30 / 13:00–15:00；港股 9:30–12:00 / 13:00–16:00；美股北京时间 21:30/22:30 – 4:00/5:00（随夏令/冬令变化）。","板块定位：主板=成熟大盘蓝筹；创业板=成长型企业（2年经验+10万门槛）；科创板=硬科技（50万+2年）；北交所=创新型中小企业。","内地参与港股：通过港股通（深/沪港通），有标的与额度限制。"],
    myths:["“T+0 的市场一定更好”——规则没有好坏，只有适不适合你的策略。","“创业板涨跌停 20% 所以赚得快”——波动大，亏得也快。"],
    actions:["确认你的账户能交易哪些板块与市场，别买错门槛。","对比同一公司在 A股与港股（AH股）的价格差异，体会市场分割。"],
    quiz:[{q:"开通科创板（硬科技）需要什么条件？",opts:["2 年交易经验 + 前 20 日日均资产 50 万","10 万资产即可","必须是机构投资者","无门槛，开户即可"],ans:0,why:"科创板门槛：2 年交易经验 + 50 万资产；创业板是 2 年 + 10 万。门槛高是因为波动更大（20% 涨跌停）。"},{"q": "A股创业板股票的日涨跌幅限制是？", "opts": ["30%","5%","10%","20%"], "ans": 3, "why": "创业板 20% 涨跌停（科创板同）；主板 10%，北交所 30%，ST 5%。"},{"q": "港股与A股最核心的规则差异是？", "opts": ["两者完全相同","有涨跌停与T+1","港股 T+0 且无涨跌停","A股 T+0 无涨跌停"], "ans": 2, "why": "A股 T+1、有涨跌停；港股 T+0、无涨跌停。规则不同，风险结构与打法也不同。"}],

  "m1c":{id:"m1c", mod:"m1", icon:"🕐", title:"交易规则",
    summary:"看懂规则才能活得久：T+1、涨跌停、费用、除权除息、委托类型、集合竞价。规则层面的无知会直接变成亏损。",
    deep:"规则无知 = 直接亏钱。除权除息：分红后股价自动下调、总资产不变，别以为“白捡”（详见下方算例）。涨跌停是价格边界，不是安全保证：涨停可能是出货，跌停可能还有连续跌停。委托：限价单控成本但可能不成交，市价单成交快但有滑点。打新：注册制后破发常态化，无脑打新时代已经结束。",
    example:"例：某股 10 元，每股分红 1 元。除息日开盘价自动变为约 9 元，你的资产从“10 元股价”变成“9 元股价 + 1 元现金”，总资产基本不变。若误以为“白赚 1 元”而加仓，就理解错了规则。",
    points:["T+1：A股当天买入次日才能卖出；融资融券、可转债等另有规则。","涨跌停是“价格边界”不是“安全保证”：涨停封不住会开板，跌停不代表超跌。","除权除息：分红后股价按分红金额自动下调，账户总资产不变——不是白捡的钱。","委托类型：限价单（指定价格）vs 市价单（按当前市场成交）；集合竞价 9:15–9:25。","ST/*ST 有 5% 涨跌幅与退市风险；退市整理期规则要了解。","打新：A股需市值配售；注册制后破发已不罕见。"],
    myths:["“分红=送钱”：除息日股价会相应下调，没分红前后没有额外收益。","“跌停股一定是机会”：跌停可能是基本面崩坏，也可能是情绪，需要辨别。"],
    actions:["通读一遍券商APP里的《交易规则》与费用说明。","实测一笔小单，记录佣金、印花税、滑点，理解真实成交成本。"],
    quiz:[{q:"除息日之后，你的总资产会？",opts:["增加（白赚一笔）","基本不变（股价相应下调）","减少一半","变成现金"],ans:1,why:"除息日股价按分红金额自动下调，总资产基本不变。分红是把部分市值变成现金，不是额外收益。"},{"q": "注册制下对“打新”的正确认识是？", "opts": ["可能破发，有真实风险","必须满仓才能打","只有机构能打","稳赚不赔，闭眼打"], "ans": 0, "why": "注册制后新股定价更市场化，破发已不罕见，无脑打新时代已经结束。"},{"q": "关于委托类型，正确的是？", "opts": ["限价单一定成交","市价单一定更便宜","两者没有区别","限价单控价但可能不成交，市价单成交快但有滑点"], "ans": 3, "why": "限价单指定价格、成交优先但可能错过；市价单立即成交但接受当前价，可能滑点。"}],
    related:["m0e","m5b","m1b"]},
  "m1d":{id:"m1d", mod:"m1", icon:"📚", title:"常用术语",
    summary:"建立术语表是看懂财报、研报和行情的第一步：市值、PE、PB、ROE、换手率、量比……每个词背后都是一种观察视角。",
    deep:"术语是地图，不是目的地。市值=股价×股本；PE=市值/净利润（可理解为“按当前盈利几年回本”）；PB=市值/净资产；ROE=净利润/净资产（公司的“利滚利”能力）；换手率=成交量/流通股本（活跃度）。同一术语在不同行业含义不同：银行看 PB 与坏账，消费看 PE 与品牌，成长股看 PS 与增速。术语帮你快速定位，不直接给买卖信号——PE/PB 的具体用法见“估值方法”节点。",
    example:"例：PE=20 可粗略理解为“按当前盈利，20 年回本”（未含增长）。若公司盈利每年增长 15%，5 年后盈利约翻倍，届时 PE 自动降到约 10 倍。所以“PE 20 贵不贵”必须结合增长看。",
    points:["市值 = 股价×总股本；流通市值 = 股价×流通股本。大盘/中盘/小盘由此划分。","PE（市盈率）= 市值 ÷ 净利润（TTM=滚动12个月）；PB（市净率）= 市值 ÷ 净资产。","ROE（净资产收益率）= 净利润 ÷ 净资产，是长期复利的发动机。","换手率 = 成交量 ÷ 流通股本，衡量交易活跃度；量比 = 今日每分钟均量 ÷ 近5日每分钟均量。","其他常用：EPS（每股收益）、股息率、PS（市销率）、PEG、自由现金流。"],
    myths:["“PE 越低越便宜”：要结合行业、增速、盈利质量看，周期股尤其容易误导。","“换手率高=主力在建仓”：也可能是出货或情绪过热。"],
    actions:["打开行情软件，把每个术语对应到一只真实股票的数字上。","把 10 个术语用“人话”各写一句解释，讲得清楚才算懂。"],
    quiz:[{q:"换手率 = 成交量 ÷ 流通股本，它主要反映什么？",opts:["分红水平","公司盈利质量","交易活跃度/市场关注度","市盈率高低"],ans:2,why:"换手率高说明筹码交换活跃、关注度高，是情绪指标，不是价值指标。高换手也可能是出货。"},{"q": "某公司 PE=20，最粗略的理解是？", "opts": ["股价还要跌20%","按当前盈利约20年回本（未考虑增长）","公司净利润20亿","公司总股本20亿"], "ans": 1, "why": "PE=市值÷净利润，可粗略理解为“按当前盈利几年回本”；未考虑增长与质量，需结合行业看。"},{"q": "ROE 很高但主要靠高杠杆实现，说明？", "opts": ["含金量可能低于靠效率实现的同等ROE","一定是最优质公司","报表一定造假","ROE 没有意义"], "ans": 0, "why": "杜邦拆解：ROE=净利率×周转×杠杆。靠杠杆堆出来的高ROE，在去杠杆/下行期很脆弱。"}],
    related:["m2c","m2b","m1a"]}

  "m2a":{id:"m2a", mod:"m2", icon:"📊", title:"财务报表入门",
    summary:"三张报表回答三个问题：资产负债表=家里有什么、欠多少（家底）；利润表=生意赚不赚钱（生意）；现金流量表=钱真的到账了吗（现金）。",
    deep:"三张表的关系：利润表算“账面上赚了多少”，资产负债表是“家底和欠债”，现金流量表是“真金白银进出了多少”。最经典的交叉验证：净利润很高但经营现金流长期为负 → 利润可能是应收款或存货堆出来的“纸面利润”——暴雷公司大多死在这里（如康美虚增货币资金、乐视大量应收账款）。读财报顺序：先看经营现金流是否和净利润匹配，再看负债结构与应收/存货增速。",
    example:"例：公司 A 今年净利润 10 亿，但经营现金流只有 2 亿。翻报表发现应收账款增加了 8 亿——货卖出去了，但钱没收到。这不是“赚了 10 亿”，是“赊出去 8 亿”。连续如此，迟早计提坏账、利润回吐。",
    points:["资产负债表：资产 = 负债 + 所有者权益。看资产质量（应收、存货占比）与负债结构（短债、有息负债）。","利润表：营收 → 毛利 → 净利。注意利润可能是“纸面利润”，可能被会计手法调节。","现金流量表：经营 / 投资 / 筹资三类现金流。经营现金流是公司自己“造血”的能力。","交叉验证：净利润很高但经营现金流长期为负 → 警惕（应收堆积、存货积压或利润造假）。","三张表要连起来看：利润表的结果最终要变成资产负债表上的资产和现金流量表里的现金。"],
    myths:["“利润高=真赚钱”：利润可以被调节，真金白银的现金流很难长期造假。","“只读利润表就够”：很多暴雷公司死在资产负债表与现金流上。"],
    actions:["找一家公司最近 3 年三张表，练习“用三句话讲清它的生意与风险”。","对每一家计划买入的公司，至少看最近 2 个季度报告原文。"],
    quiz:[{q:"最该警惕的财报信号是？",opts:["毛利率很高","负债为零","分红很慷慨","净利润与经营现金流长期背离"],ans:3,why:"利润可调节，现金流难造假。净利高+现金流长期为负，往往是应收堆积或利润造假的危险信号。"},{"q": "三张报表中，最能反映公司“造血能力”的是？", "opts": ["资产负债表里的总资产","附注说明","现金流量表里的经营活动现金流","利润表里的营收"], "ans": 2, "why": "经营现金流是公司自己赚到的真金白银，最能说明“造血”是否健康。"},{"q": "“纸面利润”最常见于？", "opts": ["股价持续上涨","应收账款堆积或存货积压","账面现金过多","分红太慷慨"], "ans": 1, "why": "利润计入但钱没收回来（应收/存货），经营现金流与净利润长期背离是危险信号。"}],
    related:["m2b","m1a","m2d","m6e"]},
  "m2b":{id:"m2b", mod:"m2", icon:"📈", title:"关键财务指标",
    summary:"从三张表里提炼出一组核心指标：营收与净利增速、毛利率、净利率、资产负债率、经营现金流、ROE、自由现金流。指标之间要互相印证。",
    deep:"指标不是越多越好，而是一组能互相印证的组合：毛利率看定价权，净利率看费用控制，ROE 看综合效率（杜邦拆解=净利率×周转率×杠杆），负债率看脆弱度，经营现金流看利润成色，自由现金流看分红能力。单看一个指标会被骗：ROE 高可能来自高杠杆，毛利率高可能只是行业景气。横向（同行）+ 纵向（自身历史）双对比才有意义。",
    example:"例：两家公司 ROE 都是 20%。甲：净利率 15% × 周转率 1.3 × 杠杆 1.02；乙：净利率 3% × 周转率 1.5 × 杠杆 4.4。同样 20%，甲靠效率、乙靠杠杆——行业下行时乙的脆弱度远高于甲。杜邦拆解让“同样的数字”现出原形。",
    points:["毛利率：定价权与护城河的第一信号；净利率：费用控制与规模效应。","增速：营收/净利增速是成长性的来源；“增速下滑”比“增速为负”更常见、更值得警惕。","资产负债率：过高=财务脆弱；但行业差异巨大（银行地产天然高杠杆），必须同行比较。","ROE 长期 15%+ 是优秀公司的常见门槛；用杜邦拆解看它来自 净利率×周转率×杠杆。","自由现金流 = 经营现金流 − 资本开支，是分红与回购的源泉。","指标要纵向（自己的历史）与横向（同行业）双对比。"],
    myths:["单看一个指标下结论（“ROE 高就是好”）。","不区分行业：用消费股的负债标准衡量银行股。"],
    actions:["用杜邦拆解分析一家公司：它的 ROE 靠利润率、周转率还是杠杆？","列一张 3 年对比表：营收、净利、毛利、经营现金流、负债率。"],
    quiz:[{q:"杜邦拆解把 ROE 拆成哪三项？",opts:["净利率 × 周转率 × 杠杆","PE × PB × PS","营收 × 利润 × 现金","毛利率 × 净利率 × 增速"],ans:0,why:"ROE = 净利率 × 资产周转率 × 权益乘数（杠杆）。拆开后能看出高 ROE 是来自效率还是来自借钱。"},{"q": "毛利率主要反映公司的什么能力？", "opts": ["费用控制","资产周转","负债管理","定价权/护城河"], "ans": 3, "why": "毛利率=毛利÷营收，体现产品卖得出溢价的定价权，是护城河的第一信号。"},{"q": "自由现金流的近似公式是？", "opts": ["营收 − 总成本","分红 × 2","经营现金流 − 资本开支","净利润 + 折旧"], "ans": 2, "why": "自由现金流=经营现金流−维持/扩张所需的资本开支，是分红与回购的“真钱”来源。"}],
    related:["m2a","m2c","m1d"]},
  "m2c":{id:"m2c", mod:"m2", icon:"💎", title:"估值方法",
    summary:"估值是比较的艺术：PE、PB、PS、PEG、股息率、DCF。贵贱永远是相对的——要和行业、自身历史、成长性比，而不是看绝对值。",
    deep:"估值的核心是“比较”：和谁比？自己历史、同行、无风险利率。PE 适合盈利稳定的公司；周期股用 PE 会踩坑（低 PE 常在盈利顶部）；银行地产看 PB；未盈利成长股看 PS；PEG 看估值与增速的匹配。DCF 理论上最正确但假设敏感——它最大的价值是逼你思考“这家公司未来 10 年的现金流”。估值是钟摆：情绪让价格偏离价值，长期均值回归。",
    example:"例：银行股 PE 5 倍、PB 0.6 倍（破净）很常见，因为市场担心坏账；消费股 PE 30 倍常见，因为盈利稳定增长。用 PE 横向比银行和消费没有意义，必须同行比、和历史比。再如周期股：盈利顶峰时 PE 可能只有 5 倍，但股价往往已见顶——“低 PE 陷阱”。",
    points:["PE 适合盈利稳定的公司；周期股要小心：低 PE 可能是盈利顶峰（陷阱），高 PE 可能是盈利底部（机会）。","PB 适合银行/地产等重资产行业；PS 适合尚未盈利的成长股。","PEG = PE ÷ 盈利增速，<1 常被视为相对便宜，但只适合成长稳定期，且增速不可靠时无意义。","DCF（现金流折现）理论上最正确，但依赖大量假设——用来建立思维框架，不要追求精确数字。","估值是钟摆：情绪让价格偏离价值，均值回归是长期规律；好公司也要好价格。"],
    myths:["“低 PE=便宜”：不区分行业、周期与增长。","“贵的东西一定跌”：高估值可以通过高增长消化，反之亦然。"],
    actions:["同行业选两只股票，做 PE/PB 横向对比，再与各自 5 年历史区间对比。","对一只股票手工做一次简化 DCF，体会“假设一变，结论就变”。"],
    quiz:[{q:"周期股出现“低 PE”通常意味着什么？",opts:["绝对便宜，闭眼买","可能正处于盈利顶峰，是陷阱","一定见底","与周期无关"],ans:1,why:"周期股盈利大起大落：低 PE 常出现在盈利顶部（盈利即将下滑），高 PE 反而常在盈利底部。看周期股要用 PB 或分位点，而不是单纯 PE。"},{"q": "PB（市净率）更适合评估哪类公司？", "opts": ["银行、地产等重资产公司","尚未盈利的烧钱科技公司","高速成长的消费股","微利贸易公司"], "ans": 0, "why": "重资产公司净资产有意义，看 PB；未盈利成长股看 PS，稳定盈利看 PE。"},{"q": "PEG 的使用前提是？", "opts": ["任何公司都能硬套","只看历史PE即可","只适用于亏损公司","盈利增速稳定可预测，且未来增速≈当前增速"], "ans": 3, "why": "PEG=PE÷增速，增速一旦不可靠或不可持续，PEG 就失真。它是筛选器不是定理。"}],
    related:["m1d","m2b","m0a","m2d"]},
  "m2d":{id:"m2d", mod:"m2", icon:"🔬", title:"行业与公司研究",
    summary:"选公司先选行业：空间、增速、竞争格局、政策环境；再看公司：护城河、商业模式、管理层与治理。行业决定赔率，公司决定胜率。",
    deep:"自上而下：行业空间（渗透率、天花板）→ 竞争格局（集中度、龙头地位）→ 政策 → 公司（护城河、商业模式、管理层）。护城河四类：无形资产（品牌/专利/牌照）、转换成本、网络效应、成本优势。商业模式要回答“赚谁的钱、凭什么持续”。管理层看激励、诚信、资本配置（是否乱并购）。好行业+好公司+好价格三者缺一，要么放弃，要么降仓位。",
    example:"例：从功能机到智能机切换期，诺基亚（功能机之王）的品牌护城河在行业变革前失效，苹果崛起。行业判断错了，公司再优秀也难逃。反过来，格局好的行业（如高端白酒、空调双寡头）龙头可以“躺赢”很久。行业决定赔率，公司决定胜率。",
    points:["行业空间：天花板越高成长越久，渗透率是核心观察指标。","竞争格局：格局好（龙头集中、壁垒清晰）往往比行业高增速更重要。","护城河四类：无形资产（品牌/专利/牌照）、转换成本、网络效应、成本优势。","商业模式：赚谁的钱、怎么赚、赚得是否可持续、是否依赖输血。","管理层与治理：激励是否与股东一致、诚信记录、资本配置能力（是否乱投资/乱并购）。","“好行业+好公司+好价格”三者齐备才动手，缺一个就要降低仓位或放弃。"],
    myths:["“行业好=公司好”：行业里也有平庸公司与输家。","“好公司=好股票”：还要看价格与预期是否已经透支。"],
    actions:["写一页纸公司研究：生意、护城河、财务、风险、合理估值、当前价格。","跟踪行业里 2–3 家龙头，读它们的季报对比增速与利润率。"],
    quiz:[{q:"以下哪一项不属于常见的护城河？",opts:["转换成本","网络效应","市盈率很低","品牌与专利"],ans:2,why:"低 PE 是“便宜”，不是“难被竞争”。护城河指竞争优势能长期持续：无形资产、转换成本、网络效应、成本优势。"},{"q": "“渗透率”这个指标主要用于判断？", "opts": ["股票的流动性","行业的天花板与所处阶段","管理层的诚信","公司的现金流质量"], "ans": 1, "why": "渗透率低→空间大成长久；渗透率高→接近天花板。行业研究先看它。"},{"q": "护城河的核心作用是？", "opts": ["阻止竞争者抢走利润，让超额收益可持续","保证股价只涨不跌","把市盈率做低","方便公司融资"], "ans": 0, "why": "护城河=长期竞争优势（品牌/转换成本/网络效应/成本），决定超额利润能否持续。"}],

  "m2e":{id:"m2e", mod:"m2", icon:"🌐", title:"宏观经济基础",
    summary:"利率、通胀、货币政策、经济周期会系统性影响股市的风格与节奏。宏观用于定“大方向与仓位”，不用于猜“明天涨跌”；过度沉迷宏观预测是浪费。",
    deep:"利率是估值的“地心引力”：利率下行 → 贴现率下降 → 成长股估值抬升；利率上行反之。通胀与货币政策（加息/降息/缩表/降准）决定流动性。经济周期四阶段利好不同资产：复苏（成长/周期）、过热（周期/资源）、滞胀（防御/现金）、衰退（债券/必需消费）。宏观的正确用法：定仓位方向和风格，不猜具体涨跌；每月花 10 分钟看利率、社融、CPI、PMI 即可。",
    example:"例：2020–2021 全球低利率，成长股（科技、新能源）估值大涨；2022 年美联储激进加息，纳指全年重挫约 33%。同样是那些公司，利率环境一变，估值剧烈重估——“利率是地心引力”的实证。",
    points:["利率是股票的“地心引力”：利率下行 → 估值抬升；利率上行 → 估值承压。成长股对利率尤其敏感。","通胀与货币政策：加息/缩表收紧流动性（利空估值），降息/降准释放流动性。","经济周期：复苏→过热→滞胀→衰退，不同阶段利好不同资产（成长/周期/消费/防御）。","观察指标：CPI、PPI、PMI、M2/社融、十年期国债收益率、汇率、北向资金。","用法：宏观定仓位方向（比如高估值环境降杠杆），微观（基本面+估值）定具体标的。"],
    myths:["把宏观预测当交易信号：预测对了也未必能赚钱，还常常滞后。","“大盘不行就清仓”：长期投资者用时间换空间，短期波动是买入机会而非威胁。"],
    actions:["每月花 10 分钟记录：利率方向、M2/社融、CPI、PMI，判断当前周期位置。","把宏观判断写成“影响仓位，不影响选股”的一句话。"],
    quiz:[{q:"利率上行对股市估值的影响通常是？",opts:["毫无影响","只影响债券不影响股票","抬升估值","压制估值"],ans:3,why:"利率是贴现率的锚：利率上行 → 未来现金流折现值下降 → 估值承压。成长股（现金流在远期）尤其敏感。"},{"q": "2022年纳指重挫约33%，最重要的宏观原因是什么？", "opts": ["美元大幅贬值","原油价格暴跌","美联储激进加息压制成长股估值","上市公司集体造假"], "ans": 2, "why": "利率上行→贴现率上升→远期现金流折现值下降，高估值成长股首当其冲。"},{"q": "“利率是地心引力”指的是？", "opts": ["利率越高股市越涨","利率影响贴现率，从而系统性影响股票估值","利率只影响银行股","利率与股市无关"], "ans": 1, "why": "利率上升→贴现率上升→远期现金流现值下降→估值承压，成长股尤甚（2022 实证）。"}],
    related:["m2d","m5a","m1b","m7f"]},
  /* ---------- 模块3：技术分析 ---------- */
  "m3a":{id:"m3a", mod:"m3", icon:"🕯️", title:"K线与成交量",
    summary:"K线是价格与情绪的压缩记录，成交量是价格背后的燃料。单根K线意义有限，量价配合才更有信号价值。记住：技术分析是观察工具，不是预测机器。",
    deep:"K线把一段时间的多空博弈压缩成一根柱：实体=多空力量，影线=反攻与失败。单根K线信号很弱，组合形态（吞没、晨星/暮星）才有统计意义。量价配合：放量突破更可信、缩量回调更健康、高位放量滞涨警惕出货。技术分析三大前提（价格反映一切、趋势延续、历史重演）都值得怀疑——研究证据显示纯技术信号扣成本后很难有稳定超额收益，把它当观察工具而非圣杯。",
    example:"例：同样一根长下影线，出现在下跌末端（可能是承接企稳）和上涨末端（可能是诱多）含义完全不同。不看位置和量能，单根K线没有信息量。记住顺序：位置 > 形态 > 单根K线。",
    points:["每根K线记录开盘/收盘/最高/最低：实体反映多空力量，影线反映反攻与失败。","单根K线（长阳/长阴/十字星）信号弱，组合形态（吞没、晨星/暮星、红三兵）才有统计意义。","量价关系：放量突破更可信、缩量回调更健康；高位放量滞涨要警惕出货。","技术分析三大前提——价格反映一切、趋势会延续、历史会重演——都值得怀疑，尤其第三条。","证据层面：纯技术信号在扣除成本后大多没有稳定超额收益，把它当“择时辅助”而非“圣杯”。"],
    myths:["把单根K线当买入信号。","“放量=主力进场”：放量也可能是一致性出货，需要位置配合判断。"],
    actions:["复盘一只股票大涨与大跌阶段的量价特征，写出 3 条共性规律。","用模拟盘验证一个“缩量回踩均线”的简单打法，统计成功率。"],
    quiz:[{q:"量价关系中，哪种情况相对更可信？",opts:["放量突破关键位","缩量阴跌","无量横盘","缩量滞涨"],ans:0,why:"放量突破说明有增量资金参与，突破的有效性更高；缩量突破/无量行情则容易是假突破或无人接盘。"},{"q": "“高位放量滞涨”更可能意味着？", "opts": ["主力在建仓","即将连续涨停","成交量不足","主力在出货/分歧加大"], "ans": 3, "why": "涨了很多之后放量却涨不动，说明卖压沉重，往往是一致性出货的信号。"},{"q": "为什么单根K线价值有限？", "opts": ["每根K线含义都一样","因为看的人太多","必须结合位置与量能才有意义","K线数据是假的"], "ans": 2, "why": "同样的形态在顶部和底部含义相反，量能决定可信度。位置>形态>单根K线。"}],
    related:["m0b","m3b","m3d"]},
  "m3b":{id:"m3b", mod:"m3", icon:"📉", title:"趋势与均线",
    summary:"趋势是你的朋友：高点低点不断抬高=上升趋势。均线是趋势的平滑器，5/10/20 看短期，60 看中期，120/250 看长期；250 日线≈牛熊分界。",
    deep:"判断趋势先于一切：高点低点抬高=上升，降低=下降，横向=震荡。均线是趋势的平滑器：5/10/20 短期、60 中期、120/250 长期（250 日线≈牛熊分界）。趋势交易赚的是“跟随大趋势的钱”，代价是震荡市反复止损。均线滞后是特性不是 bug——它不预测，只描述。先判断市场状态（趋势 vs 震荡），再决定用什么工具。",
    example:"例：简单规则“收盘站上 20 日线持有、跌破离场”，在 2019–2021 的 A股成长牛市中表现不错；在 2015 年股灾后的宽幅震荡里会被反复打脸。不是规则错了，是市场状态不匹配——任何趋势策略都怕震荡。",
    points:["趋势判断：上升=高点低点抬高；下降=高点低点降低；横盘=震荡市。先定状态，再定打法。","均线系统：多头排列（5>20>60>250）确认上升趋势；跌破关键均线需警惕转弱。","支撑与压力：前期高低点、整数关口、均线位置；突破/跌破要看成交量确认。","均线天然滞后：趋势交易者的盈利来自“跟随大趋势”，代价是震荡市反复止损。","60/250 日均线的位置关系（金叉/死叉）常用于判断中期牛熊。"],
    myths:["“金叉必涨”：均线是滞后的描述，不是领先的预言。","在震荡市里用均线系统：会被反复打脸，应先判断市场状态。"],
    actions:["在行情软件里叠加 20/60/250 日均线，标记出近 3 年的牛熊区间。","用“价格站上 20 日线持有、跌破离场”的简单规则做一段历史回测。"],
    quiz:[{q:"均线系统最大的特点/局限是？",opts:["能提前预测未来","滞后描述，震荡市会反复止损","永远有效","只适合美股"],ans:1,why:"均线由历史价格计算，天然滞后。趋势市里跟随有效，震荡市里会被反复打脸——先判断市场状态再使用。"},{"q": "250日均线通常被看作？", "opts": ["牛熊分界线","短线买卖点","主力成本线","涨停板位置"], "ans": 0, "why": "250日线≈一年平均成本，站上并走平向上通常视为牛市，跌破视为熊市。"},{"q": "为什么“先判断市场状态再选工具”？", "opts": ["所有工具都一样","均线在任何行情都准","指标越多越稳","趋势策略怕震荡、震荡策略怕单边，工具要与状态匹配"], "ans": 3, "why": "均线/趋势在趋势市有效、震荡市被反复打脸；摆动指标反之。没有万能工具。"}],
    related:["m3a","m4d","m3c"]},
  "m3c":{id:"m3c", mod:"m3", icon:"📐", title:"常用指标",
    summary:"MACD、KDJ、RSI、布林带是四大常用指标。重点是理解它们的原理和适用场景，而不是死记“金叉买、死叉卖”——每个指标都有自己的性格。",
    deep:"四个指标的“性格”：MACD=趋势+动量（趋势市好用、震荡市失真）；KDJ=摆动（震荡市好用、趋势市钝化）；RSI=强弱（>70 超买 <30 超卖，但强势股可长期超买）；布林带=均值回归（触轨道常反转，但强趋势会“打轨道”）。所有指标都是价格/成交量的函数——只是观察角度，不是原因。选 1–2 个与风格匹配的用到底，比叠一堆“共振确认”更有效（过度确认=过度滞后）。",
    example:"例：2020–2021 纳指强势行情中 RSI 长期 >70，若机械按“超买卖出”，会错过整轮上涨。“超买”在趋势市里是常态，不是卖点。指标必须结合趋势状态使用。",
    points:["MACD：趋势+动量，看 DIF/DEA 与红绿柱。适合趋势行情，震荡市频繁失真。","KDJ：超买超卖摆动指标，适合震荡市；趋势市中会长期钝化（超买还能更超买）。","RSI：强弱指标，>70 超买、<30 超卖；强势股可以长期超买，不要机械抄底。","布林带：均值回归工具，价格触上下轨时容易反转（趋势中会“打轨道”）。","所有指标都是价格/成交量的函数：指标只是观察角度，不是原因，更不是未来。","指标越多越矛盾：选 1–2 个与你风格匹配的，用到底。"],
    myths:["把指标当圣杯，金叉死叉机械交易。","用多个指标“共振确认”才敢下手：过度确认会错过大多数机会，并放大滞后。"],
    actions:["选一个指标，先读它的计算公式，再在历史K线上手动画一遍，理解它的滞后与钝化。","把“只用 1 个主指标 + 1 个辅助确认”写进自己的交易规则。"],
    quiz:[{q:"把多个指标叠在一起“共振确认”的主要问题是？",opts:["更符合直觉","会更准确","过度滞后、错过大部分机会","成本更低"],ans:2,why:"指标都是价格的函数，本质信息重叠。要求“全部共振”等于要求极端一致，信号出现极晚，机会早已错过。"},{"q": "强势趋势行情中，RSI 会怎样？", "opts": ["变得完全无效","长期钝化（超买还能更超买）","自动归零","必然见顶回落"], "ans": 1, "why": "趋势市里 RSI 可长期 >70，机械按“超买卖出”会错过整轮主升浪。"},{"q": "为什么指标“叠越多越矛盾”？", "opts": ["指标都是价格的函数，信息重复且互相滞后","指标之间会互相吵架","指标越多越准确","软件不让你用"], "ans": 0, "why": "MACD/KDJ/RSI 都由价量算出，本质是同一信息的重复加工；要求“全共振”只会大幅滞后。"}],
    related:["m3b","m4c","m3d"]},
  "m3d":{id:"m3d", mod:"m3", icon:"🔺", title:"形态识别",
    summary:"头肩顶底、双顶双底、三角形、旗形……形态是人群心理留下的“化石”。但形态必须出现在大涨/大跌之后、且完成“确认”（突破颈线/趋势线）才有意义。",
    deep:"形态是人群心理的化石，但主观性强、失败率高。三条铁律：①出现在大涨/大跌之后（位置）；②完成“确认”（放量突破颈线/趋势线）；③先算盈亏比再动手。形态越“标准”，看到的人越多，越可能失效。形态给的不是“一定涨”，而是“如果突破，盈亏比通常不错”——回到期望值思维。",
    example:"例：头肩顶在“确认”（跌破颈线）之前只是“疑似头肩顶”——提前抢跑会被假突破反复收割。等确认虽然少赚一段，但换来的是可定义的止损位和盈亏比。确认 = 把不确定变成规则。",
    points:["反转形态：头肩顶/底、双顶/双底、圆顶底——出现在大涨大跌之后才有效，中途形成毫无意义。","持续形态：三角形、旗形、矩形——出现在趋势中途，通常延续原方向。","确认是生命线：突破颈线/趋势线（最好放量）才算成立，未确认前只是假设。","形态识别主观性强：同一图形有人看多有人看空，必须结合位置、量能、基本面。","失败率高是常态：形态越“标准”，越多人看到，越可能失效。","形态给出的不是“一定涨”，而是“如果突破，盈亏比通常不错”——回到期望值思维。"],
    myths:["提前抢跑“即将形成”的形态：等确认，损失的是小段利润，换来的是确定性。","把所有历史图形套到当下：“每次都能找到相似图形”恰恰说明它没有预测力。"],
    actions:["找 10 个已走完的历史形态，统计确认后的成功/失败比例。","把“形态必须确认 + 计算盈亏比”写进自己的买入清单。"],

  "m4b":{id:"m4b", mod:"m4", icon:"📋", title:"交易规则",
    summary:"把“什么时候买、什么时候卖、买多少”写成可量化、可执行的规则，而不是感觉。纪律是散户少数能建立的真正优势。",
    deep:"规则的本质是把决策从情绪手里拿回来。好规则三要素：量化（ROE>15% 且 PE<30）、可执行（止损 -8% 触发即卖）、可验证（用日志/回测检验）。买点 = 选股标准 + 择时标准都满足；卖点三类：到目标价、逻辑破坏（基本面变坏）、触止损；仓位规则：单只上限 + 单笔亏损上限。没有规则的交易等于掷骰子。",
    example:"例：坏规则“业绩好就买”——多好算好？无法执行。好规则：“ROE>15%、PE<30、净利增速>10%、跌破 20 日线止损 8%、单笔仓位≤20%”——每条都可验证、可复盘、可优化。规则书一页纸就够。",
    points:["买入条件 = 选股标准（基本面 checklist）+ 择时标准（估值/技术信号），全部满足才动手。","卖出条件分三类：达到目标价、逻辑破坏（基本面变坏）、触及止损。","仓位规则：单只上限（如 ≤20%）、单笔亏损上限（如总资金 2%）、分批建仓方式。","规则必须能量化：“业绩好的公司”不是规则，“ROE>15% 且 PE<30 且增速>10%”才是。","每条规则都要能回答“怎么验证它有效”，否则只是愿望清单。","建立交易日志，记录每笔交易的理由、执行偏差、结果与情绪。"],

    actions:["写一份不超过一页的《我的交易规则书》：选股、择时、仓位、止损、止盈各一条。","打印贴墙：每次下单前对照 checklist，任何一条不满足就不买。"],
    quiz:[{q:"可执行规则的必要条件是？",opts:["写得足够详细","能量化、可验证","别人都说好","过去赚过钱"],ans:1,why:"“业绩好”无法执行，“ROE>15% 且 PE<30”才能执行、验证、复盘、优化。量化是规则与愿望的分界线。"},{"q": "以下哪一组是“三类标准卖点”？", "opts": ["到目标价 / 逻辑破坏 / 触止损","只设止盈、不设止损","全靠盘感","涨5%就卖、跌10%就扛、看心情"], "ans": 0, "why": "卖点分三类：达到目标、逻辑破坏（基本面变坏）、触及止损。缺一都会让规则不完整。"},{"q": "交易规则书建议写到什么程度？", "opts": ["越厚越专业","十页论文","背下来不用写","一页纸、可量化、可执行"], "ans": 3, "why": "一页纸清单足够：选股/择时/仓位/止损/止盈各一条，能执行能复盘。"}],

  "m4c":{id:"m4c", mod:"m4", icon:"🧪", title:"回测与验证",
    summary:"用历史数据检验策略是否有效，但回测通过≠实盘能赚。真正要掌握的是回测的陷阱：过拟合、未来函数、幸存者偏差、未计成本、极端行情。",
    deep:"回测是筛选器，不是印钞机。四大陷阱：①过拟合（参数太多，拟合了历史噪音）；②未来函数（用了当时拿不到的数据）；③幸存者偏差（只统计活到今天的股票）；④未计成本（佣金、滑点、涨跌停买不进卖不出）。再加样本外验证：同一规则换时间段/市场测。实盘还会打折：滑点、情绪、流动性。最后测最差情况：连续亏损期你扛不扛得住。",
    example:"例：某策略用 50 个参数“完美”拟合 2015–2021 走势，回测年化 80%——换到 2022–2025 就变成 -12%。参数越多、历史越完美，越可能是过拟合。正确做法：参数固定，一段拟合、另一段样本外验证，并计入 0.2% 单边成本。",
    points:["回测流程：定义规则 → 编码/用平台 → 跑历史 → 统计胜率、盈亏比、年化、最大回撤。","样本外验证：参数固定后在另一段时间/市场测试，避免“拟合历史”。","四大陷阱：①过拟合（参数太多）②未来函数（用了当时拿不到的数据）③幸存者偏差（只看活到今天的股票）④未计成本（佣金/滑点/涨跌停无法成交）。","实盘会打折：滑点、冲击成本、心理变形会让回测收益显著缩水。","连续亏损期是正常波动：回测要看“最差情况下你扛不扛得住”，而不只是总收益。","一个策略的收益曲线越漂亮，越要怀疑它是否过拟合。"],
    myths:["“回测赚钱=稳了”：回测是筛选器，不是印钞机。","只看总收益、不看最大回撤：50% 回撤需要 100% 上涨才能回本。"],
    actions:["用聚宽/米筐/Backtrader 等工具跑通一个最简单的均线策略，先学会流程。","对自己心仪的策略做一次“换时间段再测”，记录结果差异。"],
    quiz:[{q:"回测中最危险的问题是什么？",opts:["代码写得少","图表不好看","用了当时拿不到的数据（未来函数）","回测时间太长"],ans:2,why:"未来函数等于作弊：用事后信息回测必然“赚钱”。真实交易里你拿不到未来数据，回测结果自然作废。"},{"q": "“样本外验证”指的是？", "opts": ["参考别人的回测结果","参数固定后，换另一段时间/市场再测","把参数调多让历史更漂亮","只用最近一年的数据"], "ans": 1, "why": "同一套参数在没参与拟合的时间段测试，能检验是否过拟合。"},{"q": "“幸存者偏差”会让回测？", "opts": ["高估策略收益（只统计活到今天的股票）","低估策略收益","结果更真实","没有影响"], "ans": 0, "why": "退市股被剔除后，回测样本只剩“活下来”的股票，收益被系统性高估。"}],

  "m4d":{id:"m4d", mod:"m4", icon:"🗂️", title:"策略库与样例",
    summary:"了解几类经典策略的性格：价值、红利、动量/趋势、网格、打新/套利。每个策略都有自己的收益来源与不适用的市场——选适合你的，而不是“最好”的。",
    deep:"每种策略都有性格和怕的东西：价值（怕“便宜没好货”与长期不涨）、红利（怕公司降分红）、动量/趋势（怕震荡市连续止损）、网格（怕单边趋势）。选择标准不是“哪个最好”，而是“哪个的收益来源我懂、它的不适期我能扛”。先精通一种再扩展，别同时开太多战线。",
    example:"例：网格交易在震荡市高抛低吸很舒服；但单边上涨时早早卖光踏空，单边下跌时越买越套。趋势策略正好相反：单边行情吃大肉，震荡市连续止损。没有万能策略，只有“适合当前市场”与“你扛得住它的坏日子”。",
    points:["价值投资：低估值+优质，赚均值回归与企业成长的钱，周期 3–5 年，考验耐心。","红利策略：高股息+低波动，赚分红，防御属性强，适合震荡与熊市。","动量/趋势：强者恒强，赚趋势延续，趋势市表现好，震荡市连续止损。","网格交易：震荡市高抛低吸，趋势市要么踏空、要么套牢——必须搭配区间判断。","可转债打新/低价策略：低风险增强，注意信用风险与强赎规则。","任何策略都有“不适用的市场”——这不是策略的 bug，而是它的一部分；先知道它怕什么。"],
    myths:["“找到一个万能策略就财务自由了”：不存在。","“别人赚钱的策略我照搬就行”：策略与性格、资金、执行能力强绑定。"],

  "m5a":{id:"m5a", mod:"m5", icon:"⚓", title:"仓位控制",
    summary:"仓位是风险的第一道闸门：永不满仓单只、根据确定性与波动率决定单笔仓位、根据市场环境决定总仓位。现金不是失败，是期权。",
    deep:"仓位是三道闸门：总仓位（按市场环境：趋势向好 70–80%、震荡 50%、熊市 20–30%，因人而异并写进规则）；单只上限（一般 ≤20%，新手更保守）；单笔风险（≤2% 总资金，优先于仓位直觉）。分批建仓：金字塔加仓（越涨加得越少）。现金不是失败而是期权——满仓意味着失去选择权。仓位与确定性匹配：研究越深仓位可越高，但永远设硬上限。",
    example:"例：100 万资金，单笔风险 2%（2 万）、止损 8% → 单笔仓位 = 2万÷8% = 25 万（公式详见“仓位管理的数学”）。再加一条“单只上限 20%”→ 单只最多 20 万。规则之间互相约束，把“一把梭”堵死。",
    points:["总仓位按市场状态调节（示例）：趋势向好 70–80%、震荡 50%、熊市 20–30%，因人而异并写进规则。","单只股票上限：一般不超过总资金 20%，新手更保守；单笔亏损上限（如 2%）优先于仓位直觉。","分批建仓：金字塔加仓（越涨加得越少）、倒金字塔止损，避免高位重仓。","仓位与信心匹配：研究越深、确定性越高，仓位可以越高，但永远设硬上限。","现金是期权：手里有子弹，才能在错杀时买得到；满仓意味着失去选择权。","“仓位轻赚得少”是错觉：复利的前提是活得久。"],
    myths:["“满仓干，不然赚得少”：一次大回撤可能抹掉多年的收益。","“仓位管理是资金多的人的事”：资金越小越输不起，越需要纪律。"],
    actions:["制定自己的仓位矩阵：市场状态 × 确定性 → 仓位比例，写进规则书。","检查当前持仓：任何一只超过 20% 就分批降下来。"],
    quiz:[{q:"“现金是期权”这句话的意思是？",opts:["留现金才能在错杀时买得到，满仓=失去选择权","现金收益很高","应该永远满仓","现金会贬值，应该尽快花掉"],ans:0,why:"满仓意味着任何机会都与你无关；留现金=保留选择权，能在恐慌错杀时出手。现金不是失败，是弹药。"},{"q": "一般建议单只股票的仓位上限约为？", "opts": ["可以满仓一只","50%以上","看心情","不超过总资金20%"], "ans": 3, "why": "单只≤20% 是常见纪律，配合单笔亏损上限，保证任何单一坏消息都不伤筋动骨。"},{"q": "总仓位应该随什么调整？", "opts": ["别人的仓位","新闻标题","市场环境与自身的确定性","每天的心情"], "ans": 2, "why": "趋势向好可加仓、熊市降仓；仓位=确定性×市场环境的函数，不是情绪函数。"}],

  "m5e":{id:"m5e", mod:"m5", icon:"➗", title:"仓位管理的数学",
    summary:"仓位不是感觉，是公式：仓位 = 可承受亏损金额 ÷ 止损幅度。凯利公式给出理论上限，最大回撤数学告诉你为什么“少亏”优先于“多赚”。",
    deep:"仓位 = 总资金×单笔风险比例 ÷ 止损幅度，先定风险再反推仓位。凯利公式 f = 胜率 − 败率÷盈亏比 给出理论上限，实战用 1/4–1/2 凯利——因为你对胜率的估计并不精确，过重会放大回撤。回撤数学：-20% 需 +25%、-50% 需 +100%、-80% 需 +400%。连亏是必然：即使胜率 60%，连续 5 笔亏损的概率约 1%，仓位必须设计到扛得住。",
    example:"例：100 万本金、单笔风险 2%（最多亏 2 万）、止损 8% → 仓位 = 2万÷8% = 25 万。若止损改为 4% → 仓位 = 50 万。止损越紧、仓位越大，但止损太紧又容易被扫出局——这就是波动率与仓位的权衡。",
    points:["基础公式：仓位 = 总资金 × 单笔风险比例 ÷ 止损幅度。例：100 万、单笔风险 2%（2万）、止损 8% → 仓位 = 2万 ÷ 8% = 25万。","凯利公式：f = 胜率 − 败率 ÷ 盈亏比。凯利值是理论上限，实战建议用 1/4–1/2 凯利，因为你的胜率估计并不精确。","回撤数学：-20% 需 +25% 回本，-50% 需 +100% 回本，-80% 需 +400%——所以“控制回撤”优先于“追求收益”。","连续亏损是必然：即使单笔胜率 60%，连续 5 笔亏损的概率约 1%，仓位必须设计到扛得住连亏。","相关性决定组合风险：看似分散但同涨同跌的持仓，实际仓位等于“加总”。","波动率也决定仓位：高波动标的要用更小仓位，让每笔的风险预算一致。"],
    myths:["“轻仓没意思，重仓才赚得多”：凯利过重会放大回撤，长期复利反而更差。","“凭感觉定仓位”：感觉无法回答“这笔最多亏多少”的数学问题。"],
    actions:["用公式算一笔：我的总资金、单笔风险 2%、止损 8% → 应该买多少钱。","回测自己策略的最大连亏次数，反推最差情况下是否超出心理承受。"],
    quiz:[{q:"100 万本金、单笔风险预算 2%、止损幅度 8%，这笔应买多少？",opts:["100 万","25 万","8 万","2 万"],ans:1,why:"仓位 = 可承受亏损金额 ÷ 止损幅度 = (100万×2%) ÷ 8% = 25 万。先定风险预算，再反推仓位，而不是先想买多少。"},{"q": "凯利公式算出的仓位，实战中建议如何使用？", "opts": ["用1/4~1/2凯利","满额使用凯利","用双倍凯利","完全不用"], "ans": 0, "why": "你的胜率估计并不精确，满凯利会过度下注；取1/4~1/2 更稳健。"},{"q": "为什么“止损越紧，仓位反而越大”？", "opts": ["止损紧更安全","市场会奖励","公式本来就是反的","仓位=风险预算÷止损幅度，止损窄则仓位公式变大"], "ans": 3, "why": "单笔风险预算固定（如2%），止损 4% 可买 50万、止损 8% 只买 25万。紧止损配大仓=风险等价。"}],
    related:["m5a","m0d","m4c","m5c","m0h"]},
  "m5c":{id:"m5c", mod:"m5", icon:"🌿", title:"分散与集中",
    summary:"分散降低单一个股风险，但过度分散稀释收益。关键不是数量，而是相关性：10 只同行业股票 ≈ 1 只。跨行业、跨资产才叫真分散。",
    deep:"分散的本质是“相关性”，不是数量。10 只同行业股票 ≈ 1 只；跨行业、跨风格（成长/价值）、跨资产（股/债/现金）、跨市场（A股/美股）才是真分散。适度集中（研究最深的 3–5 只）能提升收益，但前提是研究深度配得上仓位。新手先靠指数/多行业分散站稳，能力提升后再谈集中。分散的真义：任何单一坏消息都不能让你伤筋动骨。",
    example:"例：满仓“新能源+光伏+锂电”看似 10 只分散，实际同涨同跌，2022 年回撤和满仓一只没区别。而“沪深300指数 + 债券基金 + 现金”的组合，即使股票部分大跌，债券与现金也能托底。看组合要算相关性，不是数数量。",
    points:["相关性比数量重要：持仓要跨行业、跨风格（成长/价值）、必要时跨资产（股/债/现金）。","适度集中：重仓自己研究最深的 3–5 只，收益更好，但前提是研究深度配得上仓位。","新手路径：先靠指数/多行业分散站稳，研究能力提升后再谈集中。","分散的真义：任何单一坏消息都不能让你伤筋动骨——即使一只暴雷，组合仍可承受。","“过度分散”的问题：跟踪不过来、单只研究深度不足、手续费占比上升。","集中不是梭哈：集中 + 严格止损 + 上限仓位才是一套完整逻辑。"],
    myths:["“数量多=分散好”：同涨同跌的 10 只股票和 1 只没区别。","“分散就没收益”：分散是拿部分收益换生存概率，长期是划算的。"],
    actions:["列出持仓：计算最大单只占比、行业集中度，把相关性高的合并评估风险。","如果持仓超过 8 只且都没深研，考虑换成指数基金。"],
    quiz:[{q:"以下哪个组合的分散效果最好？",opts:["10 只银行股","5 只新能源","沪深300 + 债券 + 现金","10 只医药股"],ans:2,why:"跨资产（股/债/现金）才能对冲：股票跌时债券现金托底。同行业的 10 只股票本质上还是一只高相关仓位。"},{"q": "真正决定“分散效果”的是？", "opts": ["持仓时间","资产之间的相关性","买了多少只","每只金额一样"], "ans": 1, "why": "同涨同跌的10只≈1只。跨行业、跨资产的低相关性才是真分散。"},{"q": "“同涨同跌”的持仓本质是？", "opts": ["一份大仓位，而不是分散","优秀的分散","低相关组合","高相关但无害"], "ans": 0, "why": "相关性决定风险：10只同涨同跌≈1只重仓。分散看相关性，不是数量。"}],
    related:["m5a","m0c","m5d","m5f"]},
  "m5f":{id:"m5f", mod:"m5", icon:"🧺", title:"资产配置",
    summary:"资产配置是把“股/债/现金”按比例组合，并定期再平衡，用资产间的低相关性管理整体风险。对多数人，它比选股更重要。",
    deep:"资产配置的核心不是“选最好的资产”，而是“让不同资产在时间上互补”：股票管增长、债券管稳定、现金管应急与机会。经典 60/40（股/债）长期收益接近满仓股票，最大回撤却显著更小。再平衡：定期把比例调回目标（如每年一次），等于“高抛低吸”的机械化版本——牛市强制止盈、熊市强制补仓，绕开情绪。国内实现：沪深300/中证500 指数基金 + 中长期债基/短债 + 货币基金；定投也可按股债比例分配每期资金。",
    example:"例：60/40 组合每年再平衡：股票涨到占比 75% → 卖出部分股票买债（强制止盈）；股票跌到 40% → 卖出债券补股票（强制低吸）。机械执行，不需要判断市场，就完成了“低买高卖”。",
    points:["资产配置 = 股/债/现金的比例设计与定期再平衡，比选股更重要（马科维茨：分散化是唯一免费午餐）。","股票管增长、债券管稳定、现金管应急与机会：不同资产在时间上互补。","经典 60/40（股/债）组合：长期收益接近满仓股票，但最大回撤显著更小。","再平衡（每年/每季）：把比例调回目标，等于机械化的高抛低吸，强制牛止盈、熊补仓。","定投同样适用：按股债比例把每期资金分开投。","国内实现：沪深300/中证500 指数基金 + 中长期债基/短债基金 + 货币基金。","配置比例与年龄/风险承受相关：年轻人可偏股，临近用钱多配债。"],
    myths:["“配置=收益一定低”：60/40 长期收益并不比满仓股票差多少，回撤却小很多。","“牛市全股、熊市全债”的择时：大多数人做反，机械再平衡更可靠。"],
    actions:["定一个基础比例（如 60 股/30 债/10 现金），写在规则书第一页。","每年固定一天做再平衡，记录调仓前后的比例与原因。"],
    quiz:[{q:"“再平衡”的本质是？",opts:["永远满仓股票","只买债券","预测市场涨跌","机械化的高抛低吸，强制止盈与补仓"],ans:3,why:"再平衡定期把比例调回目标：涨多的卖、跌多的买，等于把“高抛低吸”规则化，让纪律替你交易。"},{"q": "60/40 组合通常建议多久做一次再平衡？", "opts": ["每小时一次","从不调整","每年一次（或每季）","每天一次"], "ans": 2, "why": "定期（如每年）把比例调回目标，机械实现高抛低吸，频率太高反而增加成本。"},{"q": "再平衡相当于强制做了什么？", "opts": ["永远只买债券","牛市止盈、熊市补仓","每天预测涨跌","永远满仓股票"], "ans": 1, "why": "定期调回目标比例=涨多的卖、跌多的买，机械化实现低买高卖。"}],
    related:["m5c","m5a","m0c","m7h"]},
  "m5b":{id:"m5b", mod:"m5", icon:"🛡️", title:"止损与止盈",
    summary:"买入前就想好：错了怎么办、对了何时走。止损不是认输，是防止大亏的保险；止盈让利润落袋。两者合起来定义了你这笔交易的赔率。",
    deep:"止损是保险，不是认输。三种止损：固定比例（如 -8%）、技术位（跌破支撑/均线）、逻辑止损（基本面变坏）——选一种并机械执行。止损宽度要与波动率匹配：高波动股用宽止损+小仓位，风险等价（公式见“仓位管理的数学”）。止盈三式：目标价分批卖、移动止盈（从高点回撤 X% 离场）、估值/逻辑兑现。不止损的代价：-50% 需 +100% 回本。止损被扫后上涨是常态——那是保费。提前写好，盘中不临时决定。",
    example:"例：10 元买入，止损 9.2 元（-8%），移动止盈“从最高价回撤 10% 离场”。股价涨到 15 元后回落至 13.5 元触发 → 盈利 35% 落袋。若没有移动止盈，可能一路坐回 10 元。止损+止盈合起来，定义了这笔交易的赔率。",
    points:["止损三式：固定比例（如 -8%）、技术位（跌破支撑/均线）、逻辑止损（基本面变坏）——选一种并执行。","止损宽度要与波动率匹配：高波动股票用更宽止损 + 更小仓位，风险等价（回到仓位公式）。","止盈三式：目标价（到价分批卖）、移动止盈（从高点回撤 X% 离场）、估值/逻辑兑现（高估时分批卖）。","不止损的代价：-50% 需要 +100% 回本；小亏变大亏是散户第一杀手。","止损被扫后股价又涨是常态：这是保险的“保费”，止损的价值在于截断尾部风险。","止损要提前设好并写下来：盘中临时决定 = 情绪决定。"],
    myths:["“止损就是割肉认输”：止损是把不确定变成确定的小亏。","“它一定会涨回来”：退市股、价值毁灭的股票永远不会。"],
    actions:["每次下单前把止损价写在订单备注里，没有止损就不买。","统计一年里“止损后上涨”的次数，接受它作为保费成本。"],
    quiz:[{q:"止损被扫后股价又涨了，这说明？",opts:["这是保费，属于正常成本","市场故意针对你","必须立刻追回来","止损错了，以后不设了"],ans:0,why:"止损的价值在截断尾部风险，不在“每次都对”。被扫后上涨是保险的保费——只要长期期望为正，这笔成本就值得。"},{"q": "“移动止盈”的操作是？", "opts": ["到固定目标价一次性全卖","跌破买入价才卖","持有一年就卖","从最高点回撤一定幅度（如10%）就离场"], "ans": 3, "why": "移动止盈让利润“跟车”：涨得越高、离场价越高，回撤时锁定大部分利润。"},{"q": "止损宽度应该与什么匹配？", "opts": ["买入价的整数位","手续费的多少","标的的波动率","别人的止损位"], "ans": 2, "why": "高波动标的需要更宽止损+更小仓位，让每笔的风险预算一致，而不是拍脑袋定 -8%。"}],
    related:["m0d","m4b","m5d","m1c"]},
  "m5d":{id:"m5d", mod:"m5", icon:"🧘", title:"心态管理",
    summary:"亏损后的冲动、盈利后的膨胀，都是系统性风险。心态不是靠“忍”，而是靠规则化与减少暴露：写下来、定好价、少盯盘。",
    deep:"追涨杀跌、急于翻本——是情绪在替你下单，不是你的策略。解药不是“心态好”（心态是流程的结果），而是：决策写下来、买卖价提前设定、减少盘中盯盘（如每天只看收盘）、连续亏损强制休息、用亏得起的钱。把交易当概率游戏：单笔结果随机，长期结果由规则决定，别用单笔论英雄。盯住执行质量，而不是当天盈亏。",
    example:"例：熔断规则——“单月亏损达 10% 强制停手，只复盘不交易一周；恢复交易后仓位减半。”这条规则直接截断“越亏越急、越急越亏”的死亡螺旋，把情绪关在笼子里。",
    points:["追涨杀跌、频繁交易、急于翻本：这是情绪在替你下单，不是你的策略。","对策：决策提前写下来、买卖价提前设定、减少盘中盯盘次数（如每天只看收盘）。","连续亏损后强制休息：亏损达阈值（如单月 -10%）停手一周，防止报复性交易。","用亏得起的钱：资金属性决定心态，杠杆或急用钱必然让决策变形。","把交易当概率游戏：单笔结果随机，长期结果由规则决定，别用单笔论英雄。","盯住“执行质量”而不是“当天盈亏”：执行好，盈亏是统计结果。"],
    myths:["“心态好就能赚钱”：心态是纪律与流程的结果，不是天赋或鸡汤。","“今天赚了，说明我状态好”：短期结果没有信息量，别用几笔交易验证能力。"],
    actions:["设立熔断规则：单月亏损达 X% 强制停手、只复盘不交易。","把“每日看盘次数 ≤ 3 次”写进规则，用收盘后复盘代替盘中焦虑。"],
    quiz:[{q:"心态管理的治本方法是？",opts:["反复暗示自己冷静","把决策规则化并减少盘中暴露","亏了就加大仓位翻本","永远不看账户"],ans:1,why:"“冷静”靠不住——压力下偏差自动出现。规则化（提前定买卖价）+ 减少暴露（少盯盘）才能把情绪关在笼子里。"},{"q": "连续亏损、情绪上头时，最该做的是？", "opts": ["停手、只复盘不交易","加倍仓位把亏的赚回来","立刻换一只股票","加杠杆抄底"], "ans": 0, "why": "“越亏越急、越急越亏”是死亡螺旋；熔断式停手复盘是唯一的刹车。"},{"q": "减少情绪干扰最实用的习惯是？", "opts": ["一有空就刷行情","频繁做T","盯大V直播找感觉","减少盘中盯盘，每天只看收盘"], "ans": 3, "why": "看盘越多越容易被分时波动勾走情绪；收盘复盘代替盘中焦虑是纪律的起点。"}],
    related:["m0f","m6c","m5b"]}

  "m6a":{id:"m6a", mod:"m6", icon:"🎮", title:"模拟盘练习",
    summary:"先用模拟盘验证理解与策略：熟悉软件、验证逻辑、练习流程。但模拟盘有“心理失真”——亏的不是真钱，不会触发真实情绪，止损纪律必须在实盘小资金里练。",
    deep:"模拟盘三大用途：熟悉软件、验证策略逻辑、练习完整流程（选股→下单→复盘）。但局限明显：亏损不痛，触发不了真实情绪。所以正确路径是：模拟盘跑通流程（1–3 个月）→ 小资金实盘练心态。给模拟盘设定和实盘一样的规则，否则练出来的流程没法迁移。",
    example:"例：模拟盘设置——起始 50 万、单只≤20%、止损 -8%、每月复盘一次。跑一个季度后统计：胜率、盈亏比、最大回撤、违反规则次数。如果模拟盘都跑不赢指数，实盘更不可能。",
    points:["模拟盘三大用途：熟悉工具、验证策略逻辑、练习完整流程（选股→下单→复盘）。","平台示例：东方财富/同花顺模拟盘、雪球组合、券商自带模拟、聚宽/米筐（可回测）。","给模拟盘设定和实盘一样的规则：起始资金、风格、单只上限、止损规则。","至少跑一个完整周期（如一个季度），统计胜率、盈亏比、回撤，再决定是否进入实盘。","模拟盘最大的局限：亏损不痛 → 学不到真实心态；所以它不能替代小资金实盘。","把模拟盘当“实验记录”，所有决策写理由，方便日后对照实盘行为。"],
    myths:["“模拟盘赚钱=实盘也能赚”：模拟没有滑点与情绪，结果通常偏乐观。","“模拟没用，直接实盘”：没有流程熟练度就实盘，等于交学费给市场。"],
    actions:["今天开一个模拟盘，写下起始资金与规则，承诺跑满 3 个月。","每月末复盘模拟盘：胜率、回撤、违反规则几次。"],

  "m6b":{id:"m6b", mod:"m6", icon:"💵", title:"小资金实盘",
    summary:"用亏得起的钱开始：首笔金额即使全部亏光也不影响生活。目标不是赚钱，而是验证模拟盘结论在真实环境（滑点、情绪、成本）下是否成立。",
    deep:"首笔金额 = 亏光也不影响生活的钱（如几千元），这是“学费预算”。实盘目标不是赚钱，是验证模拟盘结论在真实环境成立：滑点、情绪、手续费。前 3–6 个月把“严格执行规则”当唯一 KPI。连续稳定 6–12 个月再考虑加资金，加资金也要分批。 记住：这一阶段的“学费”，买到的是真实环境下的行为数据，比任何模拟盘成绩都值钱。",
    example:"例：目标设定——“连续 20 笔交易严格执行规则（不追高、不扛单、不超仓）”比“赚 10%”更有价值。达到后再加资金；没达到就继续小资金练，别急着加钱。",
    points:["金额选择：即使 100% 亏光也不影响生活的钱（如几千元），这是“学费预算”。","实盘目标：把“严格执行规则”当作唯一 KPI，收益率放第二位。","实盘与模拟的真实差异：恐惧与贪婪、真实滑点与手续费、真实流动性。","前 3–6 个月只求稳定执行：连续 X 笔不违反规则，比赚 10% 更有价值。","连续稳定 6–12 个月后，再考虑逐步增加资金；增加资金时也要分批。","小资金亏光不可怕，可怕的是“用输不起的钱”或“亏光后借钱翻本”。"],

  "m6c":{id:"m6c", mod:"m6", icon:"🔍", title:"复盘方法",
    summary:"复盘是能力增长最快的方式：记录 → 归类 → 找重复错误 → 改规则。复盘的核心是评估“决策质量”，而不是“盈亏结果”。",
    deep:"复盘的唯一目的是“改规则”。区分决策质量与结果：好决策可能亏钱，坏决策可能赚钱——复盘必须看决策，否则会被随机结果带偏。交易日志字段：日期、标的、理由、价格、仓位、结果、情绪、评分。找重复错误（追高几次、止损犹豫几次），同一错误出现 3 次就改规则。复盘不改规则 = 写日记。",
    example:"例：本月复盘统计——“追高 4 次（每次买入时已涨超 5%）、止损犹豫 2 次（平均多亏 3%）、违反仓位规则 1 次”。结论：把“涨幅>3% 不追”写进买入清单，把止损设为自动条件单。用统计驱动修改，而不是感觉驱动。",
    points:["交易日志字段：日期、标的、买卖理由、价格、仓位、结果、情绪（恐惧/贪婪/平静）、自评打分。","区分决策质量与结果：好决策可能亏钱，坏决策可能赚钱——复盘必须看决策，否则会被随机结果带偏。","找重复错误：本月追高几次？止损犹豫几次？违反规则几次？同一错误出现 3 次就该改规则。","周/月统计：胜率、盈亏比、最大回撤、与规则的偏差率。","把复盘结论变成规则修订：复盘不改规则，就只是写日记。","亏损复盘重“流程”，盈利复盘重“运气成分”——不要只复盘亏损。"],
    myths:["“只复盘亏钱的单子”：赚钱的单子往往藏着坏习惯（重仓、没止损）。","“记得住，不用写”：记忆会被情绪扭曲，白纸黑字才有数据。"],
    actions:["建一个表格（Excel/Notion/纸质），从今天起每笔交易都记录。","每周日 20 分钟复盘：统计偏差，找出本周重复出现的错误。"],
    quiz:[{q:"复盘最该评估的是什么？",opts:["决策质量与规则执行","新闻说了什么","别人的收益","当天赚了多少钱"],ans:0,why:"单笔结果随机，好决策可能亏钱、坏决策可能赚钱。复盘看决策质量，长期统计才看结果。"},{"q": "交易日志里最该记录的是？", "opts": ["只记赚钱的交易","只记亏钱的交易","别人怎么操作","买卖理由、情绪、执行偏差"], "ans": 3, "why": "记录决策与情绪才能复盘“决策质量”，区分运气与能力。"},{"q": "同一个错误出现几次就该改规则？", "opts": ["10次以上","永远不该改","3次左右","1次就彻底放弃"], "ans": 2, "why": "一两次可能是噪声，同一错误反复出现说明是系统性问题，应触发规则修订。"}],

  "m7a":{id:"m7a", mod:"m7", icon:"🗃️", title:"指数基金是什么",
    summary:"指数基金 = 以“复制某个指数”为目标的被动基金，费率低、透明度高。大类下有：国内宽基（沪深300、中证500、上证50）、海外宽基（纳指100、标普500、日经225）、行业主题等。纳指100与标普500是其中的“海外宽基指数”。",
    deep:"指数基金按“复制什么指数”分类：①宽基指数——覆盖整个市场/大盘（国内：沪深300/中证500/上证50；海外：标普500/纳指100/日经225）；②行业/主题指数——聚焦某行业（新能源、医药、科技）；③策略指数——红利、低波等。按交易方式分：场内 ETF（股票账户实时买卖）、场外联接/普通指数基金（按净值申赎）、LOF（两者皆可）。按投资市场分：国内指数基金 vs QDII 指数基金（投海外）。纳指100=海外科技成长宽基，标普500=海外全市场均衡宽基，沪深300=国内大盘宽基——它们是一类东西（宽基指数基金）里的不同风格。",
    example:"例：把指数基金想象成“自动跟踪的篮子”——沪深300 是“A股最大的 300 家”，标普500 是“美国最大的 500 家”，纳指100 是“纳斯达克最大的 100 家非金融公司”。你买的是整个篮子，而不是赌其中某一家。",
    points:["指数基金=以复制某个指数为目标的被动基金，费率低、透明度高。","按覆盖范围分：宽基（沪深300/标普500/纳指100）vs 行业主题（新能源/医药/科技）vs 策略（红利/低波）。","按交易方式分：场内 ETF（实时买卖）、场外联接/普通指数基金（按净值申赎）、LOF（两者皆可）。","按投资市场分：国内指数基金 vs QDII 指数基金（投海外）。","纳指100=海外科技成长宽基；标普500=海外全市场均衡宽基；沪深300=国内大盘宽基——都是“宽基”里的不同风格。","买指数基金前先问：这个指数代表什么市场/风格？我为什么选它？"],

    actions:["列出你知道的 3 个宽基指数（如沪深300、标普500、纳指100），各写一句话风格。","在天天基金搜“沪深300”和“标普500”，感受同一指数的不同产品。"],

  "m7b":{id:"m7b", mod:"m7", icon:"🧾", title:"海外指数基金怎么买（QDII渠道）",
    summary:"国内个人买美股指数（纳指100/标普500）的唯一合规渠道是 QDII 基金：场外申购（天天基金/支付宝/银行）或场内买卖（股票账户买 ETF/LOF）。两条路各有优劣。",
    deep:"QDII（合格境内机构投资者）= 基金公司用国家批准的外汇额度，替你在境外投资：你人民币申购，基金换成美元买美股指数，净值以人民币计价。两条路：①场外——天天基金/支付宝/银行/基金公司APP，按当日净值申赎，适合定投，但有限购、确认慢（T+2 确认，到账 3–10 个工作日）；②场内——股票账户像买股票一样按实时价格买卖 ETF/LOF，无申购限额，但可能溢价（价格>净值）。新手定投建议场外；场内适合懂溢价的进阶者。",
    example:"例：在支付宝搜“纳斯达克100”会看到易方达/广发/华夏等联接或 LOF 基金；在券商 APP 搜“纳指ETF”会看到 513100、159941 等场内品种。同一个指数，场外买“份额”按净值、场内买“份额”按市价——市价可能比净值贵（溢价）。",
    points:["QDII = 基金公司用外汇额度替你投资海外，你人民币申购、净值按人民币算。","场外：天天基金/支付宝/银行/基金公司APP，按当日净值申赎，适合定投；限购多、确认到账慢。","场内：股票账户买 ETF/LOF，实时价格、无限购，但要注意溢价。","T+2 确认申购，赎回资金到账通常 3–10 个工作日（不同产品不同）。","基金类型：场内 ETF / 场外联接基金（投资对应ETF）/ LOF（场内场外都能买）。","汇率影响：人民币贬值→对 QDII 净值是加分项，升值→减分项（详见 m7g）。","风险提示：QDII 受汇率、溢价、跟踪误差、基金公司额度多重影响，不是“零风险”。"],
    myths:["“场内没有限购就等于更便宜”：可能溢价，买贵了照样亏。","“QDII 到账慢是基金公司懒”：跨境结算与额度机制决定的，属正常。"],
    actions:["打开支付宝/天天基金搜“纳斯达克100”和“标普500”，记下你看到的基金名称与代码。","确认你的券商APP能不能买场内 ETF（搜“纳指ETF”试一下）。"],
    quiz:[{q:"国内个人买纳指100/标普500 的合规渠道是？",opts:["QDII 基金（场外申购或场内 ETF/LOF）","数字货币交易所","随便买跨境理财","境外券商直接开户"],ans:0,why:"国内个人投资海外指数，合规路径就是 QDII 基金：场外按净值申赎、场内按市价买卖。其他渠道要么不合法、要么门槛高。"},{"q": "纳指100 的成分股中，剔除了哪类公司？", "opts": ["科技公司","消费公司","医疗公司","金融公司"], "ans": 3, "why": "纳指100 按编制规则剔除金融股，所以它是“非金融+高科技”的科技成长指数。"},{"q": "QDII 中的“Q”代表什么？", "opts": ["量化","轻量","合格（Qualified，指合格境内机构投资者）","快捷"], "ans": 2, "why": "QDII = Qualified Domestic Institutional Investor（合格境内机构投资者），靠审批的外汇额度投资海外。"}],

  "m7c":{id:"m7c", mod:"m7", icon:"🚀", title:"纳指100深度",
    summary:"纳斯达克100 = 纳斯达克交易所市值最大的 100 家非金融公司（英伟达、苹果、微软、亚马逊、Meta、谷歌、特斯拉等），科技权重极高，是“科技成长”风格的代表指数。",
    deep:"纳指100 特点：①科技浓度极高——前十大权重合计约占 45%–50%，信息技术+通信+可选消费（科技平台）合计 80% 左右，本质是“全球科技巨头指数”；②成长性强但波动大——2000 年互联网泡沫最大回撤约 80%，2022 年约 -33%，牛市弹性也大；③市值加权、龙头集中；④剔除金融股。截至 2025 年末，前十大大致为：英伟达（约 9%）、苹果（约 8%）、微软（约 7%）、亚马逊、Meta、博通、谷歌（A+C）、特斯拉、奈飞——权重随季度调仓变化。估值看 PE 历史分位，科技股对利率敏感（见 m2e）。",
    example:"例：同样 1 万元买纳指100，相当于把约 900 元押在英伟达、800 元押在苹果、700 元押在微软……前十大公司占了一半仓位。所以“买纳指”本质是“买美国科技巨头”，不是“100 家公司平均分散”。",
    points:["定义：纳斯达克交易所市值最大的 100 家非金融公司，剔除金融股。","科技浓度高：信息技术+通信服务+可选消费（科技平台）占比极高，前十大权重约占一半。","代表公司：英伟达、苹果、微软、亚马逊、Meta、谷歌、博通、特斯拉、奈飞等（权重随季度调整）。","波动大：2000 年互联网泡沫最大回撤约 80%，2022 年约 -33%；牛市弹性也大。","对利率敏感：成长股现金流在远期，利率上行估值受压明显（2022 年实证）。","估值看 PE 历史分位，别只看绝对值；高位定投要放慢节奏。"],
    myths:["“纳指100=美国经济”：它是科技成长风格，不是美股全市场。","“指数会自动分散”：前十大占一半，实际集中度很高。"],
    actions:["在天天基金/理杏仁查当前纳指100 的 PE 与历史分位。","列出前十大成分股，理解你实际买了什么。"],
    quiz:[{q:"买纳指100，本质上是买什么？",opts:["100 只平均分散的股票","美国科技巨头（前十大约占一半）","美国全部上市公司","以金融股为主"],ans:1,why:"纳指100 市值加权且科技浓度极高，前十大权重约占一半。买它≈买美国科技巨头，集中度远比想象高。"},{"q": "与纳指100相比，标普500的最大特点是？", "opts": ["行业更均衡（含金融/医疗/工业等）","科技占比更高","成分股更少","波动一定更小"], "ans": 0, "why": "标普500 覆盖美国500家大型公司、行业分散；纳指100 则是高度集中的科技风格。"},{"q": "纳指100 对哪类宏观变量最敏感？", "opts": ["国际油价","黄金价格","猪肉价格","利率（高估值科技成长股对贴现率敏感）"], "ans": 3, "why": "纳指100 现金流集中在远期，利率上行时折现值缩水最明显——2022 年已实证。"}],

    deep:"标普500 特点：①覆盖面广——500 只大盘股覆盖美股约 80% 市值，含金融（摩根大通等）、医疗（礼来/强生等）、工业、能源，比纳指100 均衡；②市值加权，但有委员会筛选（盈利、流动性、行业代表）；③长期年化约 8%–10%（名义，历史区间），是巴菲特十年赌约的标的；④集中度也在上升——2025 年前十大权重约 38%–41%（英伟达约 7%–8%、微软约 6%–7%、苹果约 6%–7%、谷歌、亚马逊、Meta、博通等），“七巨头”主导现象明显；⑤含少量股息（股息率约 1.2%–1.4%），QDII 投资美股分红会被预扣税（中美协定下通常约 10%，以基金公告为准）。",

  "m7e":{id:"m7e", mod:"m7", icon:"🚧", title:"额度与限购",
    summary:"热门 QDII 基金经常限购甚至暂停申购，根因是基金公司的外汇（QDII）额度有限。2025–2026 年尤为突出：单日申购限额一度压到 10 元、多只产品暂停申购。理解机制，才能不慌。",
    deep:"机制：国家外汇局给每家公司批 QDII 额度（总额有限），额度用满→限购/暂停，防止规模失控影响跟踪。2025–2026 实测：热门产品单日限额从 500 元→50 元→20 元→10 元，多只直接暂停申购；场内 ETF 不限购但被资金涌入推高溢价（2026 年中曾高达 19%）。应对：①接受限额，小额高频定投（定投天然适配限额）；②多平台多产品对比（不同基金公司额度状态不同）；③场内买但认准溢价（溢价 >3–5% 不追）；④关注新发产品/联接基金，额度往往更宽裕；⑤长期看额度会动态调整，暂停申购≠产品消失。",
    example:"例：某纳指联接基金公告“单日单账户限额 100 元”。想每月定投 3000 元怎么办？→ 拆成多个平台/多只产品各定投一部分，或接受“每天定投 100 元”的节奏，或改投额度宽裕的同类产品。定投本身就是小额高频，天然适配限额。",
    points:["根因：国家外汇局给基金公司的 QDII 外汇额度有限，额度用满就限购/暂停。","2025–2026 现状：单日限额压到 10–500 元、多只产品暂停申购，场内 ETF 被资金推高溢价（曾达 19%）。","限购的是“场外申购”，场内 ETF/LOF 二级市场买卖不受此限，但要承担溢价。","应对一：接受限额，小额高频定投（定投天然适配限额）。","应对二：多平台、多产品对比（不同基金公司额度状态不同）。","应对三：场内买入但严格看溢价，溢价过高不追。","应对四：关注新发产品/联接基金，额度往往更宽裕。","暂停申购≠产品消失：额度会动态调整，长期投资者不用慌。"],
    myths:["“限购=基金要跑路”：是外汇额度机制，不是产品风险。","“限购越严越要抢着买”：恐慌追高往往买在溢价高位。"],
    actions:["查一下你想买的基金当前“申购状态与限额”（天天基金→基金详情→公告）。","把“限购时期小额定投”写进你的执行计划，别等额度。"],
    quiz:[{q:"QDII 基金限购的根本原因是？",opts:["证监会禁止买美股","美股休市","基金公司不想赚钱","基金公司的外汇（QDII）额度有限，用完了只能限购"],ans:3,why:"外汇局给每家公司的 QDII 额度有限，额度用满就限购/暂停，防止规模失控。这是机制现象，2025–2026 尤其突出。"},{"q": "QDII 限购限制的是哪种行为？", "opts": ["分红","赎回","场外申购（场内二级市场仍可买卖，但有溢价风险）","场内交易"], "ans": 2, "why": "限购管的是基金公司“新吸收资金”的额度；场内买卖不新增申购，但可能溢价。"},{"q": "限购时期，定投者应有的心态是？", "opts": ["借钱一次买够","小额定投坚持执行，绝不追高溢价","越限购越要抢额度","干脆放弃定投"], "ans": 1, "why": "限购是额度机制不是机会信号。小额定投+多产品分散，比恐慌抢购更理性。"}],
    related:["m7f","m7g","m7b"]},
  "m7f":{id:"m7f", mod:"m7", icon:"📅", title:"定投实战",
    summary:"定投（定期定额）是“限购时代”最适合普通人的方式：小额高频、摊平成本、克服择时焦虑。但要理解它的原理与局限，避免“无脑定投”。",
    deep:"定投原理：每月固定金额买入，净值高时买得少、净值低时买得多，自动摊平成本——“微笑曲线”：下跌时积累便宜份额，反弹时受益。与一次性对比：一次性投入期望收益更高（若市场长期向上），但需要择时与心态；定投牺牲部分收益换“不用择时、拿得住”。局限：①单边下跌时“越跌越买”也会亏，但要继续，否则微笑曲线断裂；②高位开始定投需要更久摊平；③本金变大后定投摊薄作用减弱。纪律：固定日期金额、跌了不慌（甚至加码）、到目标收益分批止盈、止盈后继续下一轮。",
    example:"例：每月 1000 元定投纳指100 联接基金：净值 1.0 元买 1000 份、0.8 元买 1250 份、1.2 元买 833 份……成本自动摊平。微笑曲线：净值 1→0.8→0.5→0.8→1.2，一次性买入者在 0.5 元时已崩溃，定投者却积累了最多便宜份额，净值回到 1.2 时收益可观。",
    points:["原理：定期定额，高时买少、低时买多，自动摊平成本（微笑曲线）。","与一次性对比：一次性期望收益更高但需要择时与心态；定投牺牲部分收益换“拿得住”。","限购时代：小额高频天然适配申购限额，定投=最优解之一。","纪律：固定日期金额、跌了继续甚至加码、到目标止盈、止盈后继续下一轮。","局限①：单边下跌也要坚持，否则微笑曲线断裂；局限②：高位开始要更久摊平；局限③：本金大了定投摊薄作用减弱。","止盈参考：用估值分位（PE 高位分批止盈），或目标收益率（如 +30% 卖 1/3）。","风险提示：定投不改变标的的风险，纳指/标普下跌时定投照样浮亏。"],

const W = ()=>graphEl.clientWidth, H = ()=>graphEl.clientHeight;
const view = {k:0.9, tx:0, ty:0};
function applyView(){ gMain.setAttribute("transform",`translate(${view.tx} ${view.ty}) scale(${view.k})`); }
function fitView(){
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  nodes.forEach(n=>{ minX=Math.min(minX,n.x-n.r-20); maxX=Math.max(maxX,n.x+n.r+20); minY=Math.min(minY,n.y-n.r-24); maxY=Math.max(maxY,n.y+n.r+8); });
  const bw=Math.max(maxX-minX,1), bh=Math.max(maxY-minY,1);
  view.k=Math.min((W()-90)/bw,(H()-90)/bh,1.5);
  view.k=Math.max(view.k,0.32);
  view.tx=(W()-bw*view.k)/2 - minX*view.k;
  view.ty=(H()-bh*view.k)/2 - minY*view.k;
  applyView();
}

nodes.forEach((n,i)=>{ const a=i/N*Math.PI*2; const rx=Math.min(W()*0.44, 620), ry=Math.min(H()*0.42, 430); n.x=W()/2+Math.cos(a)*rx+(Math.random()-.5)*80; n.y=H()/2+Math.sin(a)*ry+(Math.random()-.5)*80; });

  const em = document.createElementNS(svgNS,"text"); em.setAttribute("class","em"); em.setAttribute("text-anchor","middle"); em.setAttribute("dominant-baseline","central"); em.setAttribute("y",1); em.setAttribute("font-size", n.hub?17:12); em.textContent = n.hub ? modById[n.mod].icon : NODES[n.id].icon;
  const lbl = document.createElementNS(svgNS,"text"); lbl.setAttribute("class","lbl"); lbl.setAttribute("text-anchor","middle"); lbl.setAttribute("x",0); lbl.setAttribute("y", n.r+16); lbl.setAttribute("font-size", n.hub?12.5:11); lbl.setAttribute("font-weight", n.hub?700:400);
  lbl.textContent = n.hub ? modById[n.mod].name : NODES[n.id].title;
  const ck = document.createElementNS(svgNS,"text"); ck.setAttribute("class","checkmark"); ck.setAttribute("text-anchor","middle"); ck.setAttribute("dominant-baseline","central"); ck.setAttribute("x",n.r*0.55); ck.setAttribute("y",-n.r*0.55); ck.setAttribute("font-size",12); ck.setAttribute("font-weight",700); ck.setAttribute("fill","#3ecf8e"); ck.textContent="✓";
  g.appendChild(halo); g.appendChild(ball); g.appendChild(em); g.appendChild(lbl); g.appendChild(ck);

const edgeEls = links.map(l=>{

function edgePath(l){
  const a=nodeById[l.s], b=nodeById[l.t];
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  let dx=b.x-a.x, dy=b.y-a.y; const len=Math.hypot(dx,dy)||1;
  let off = l.k==="belong" ? 0 : (l.k==="pre" ? Math.min(len*0.05,14) : Math.min(len*0.11,36));
  if(off){ let h=7; const key=l.s+"|"+l.t; for(let i=0;i<key.length;i++) h=(h*31+key.charCodeAt(i))|0; if(h<0) off=-off; }
  const px=-dy/len*off, py=dx/len*off;
  return `M ${a.x} ${a.y} Q ${(mx+px).toFixed(1)} ${(my+py).toFixed(1)} ${b.x} ${b.y}`;
}
function render(){
  nodes.forEach(n=>{ const g=nodeEls[n.id]; g.setAttribute("transform",`translate(${n.x} ${n.y})`); });
  edgeEls.forEach(({path,l})=>{ path.setAttribute("d", edgePath(l)); });
}

/* ================= force simulation ================= */
let alpha = 1, running = false;
function physics(){
  const damp = 0.82;
  for(const l of links){
    const a=nodeById[l.s], b=nodeById[l.t]; let dx=b.x-a.x, dy=b.y-a.y; let d=Math.hypot(dx,dy)||1;
    const f=(d-l.rest)*0.022*alpha; const fx=dx/d*f, fy=dy/d*f;
    a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
  }
  for(let i=0;i<nodes.length;i++){ const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){ const b=nodes[j]; let dx=b.x-a.x, dy=b.y-a.y; let d=Math.hypot(dx,dy)||1;
      const minD=(a.r+b.r)*0.9; if(d<minD) d=minD;
      let f=Math.min(6400/(d*d), 11)*alpha;
      if(a.hub&&b.hub) f*=2.6;
      else if(a.mod!==b.mod) f*=1.3;
      f=Math.min(f, 60);
      const fx=dx/d*f, fy=dy/d*f; a.vx-=fx; a.vy-=fy; b.vx+=fx; b.vy+=fy;
    }
  }

  for(const n of nodes){ if(n.hub) continue; const hub=nodeById["hub-"+n.mod];
    let dx=hub.x-n.x, dy=hub.y-n.y; const d=Math.hypot(dx,dy)||1;
    const f=(d-105)*0.012*alpha; n.vx+=dx/d*f; n.vy+=dy/d*f; }
  const cx=W()/2, cy=H()/2;
  for(const n of nodes){ n.vx+=(cx-n.x)*0.0042*alpha; n.vy+=(cy-n.y)*0.0042*alpha; }
  for(const n of nodes){ n.vx*=damp; n.vy*=damp; n.x+=n.vx; n.y+=n.vy; }
}
function step(){
  physics();
  alpha*=0.95;
  render();
  if(alpha>0.02){ running=true; requestAnimationFrame(step); } else running=false;
}
function reheat(a){ alpha=Math.max(alpha, a||0.4); if(!running){ running=true; requestAnimationFrame(step); } }

/* ================= interactions ================= */
let selected = null;
function onNodeDown(ev,n){
  ev.stopPropagation();
  const rect=svg.getBoundingClientRect();
  const toWorld=(e)=>{ const sx=e.clientX-rect.left, sy=e.clientY-rect.top; return [(sx-view.tx)/view.k,(sy-view.ty)/view.k]; };
  let moved=false;
  const mv=e=>{ moved=true; const [wx,wy]=toWorld(e); n.x=wx; n.y=wy; n.vx=0; n.vy=0; reheat(0.25); };
  const up=e=>{ window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up);
    if(!moved) selectNode(n.id); };
  window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up);
}
svg.addEventListener("wheel", e=>{
  e.preventDefault();
  const rect=svg.getBoundingClientRect(); const sx=e.clientX-rect.left, sy=e.clientY-rect.top;
  const k2=view.k*Math.pow(1.0016,-e.deltaY); view.k=Math.max(0.3,Math.min(3,k2));
  const wx=(sx-view.tx)/view.k, wy=(sy-view.ty)/view.k;
  view.tx=sx-wx*view.k; view.ty=sy-wy*view.k; applyView();
},{passive:false});
let panning=false, px=0, py=0;
svg.addEventListener("pointerdown", e=>{ if(e.target!==svg) return; panning=true; px=e.clientX; py=e.clientY; });
window.addEventListener("pointermove", e=>{ if(!panning) return; view.tx+=e.clientX-px; view.ty+=e.clientY-py; px=e.clientX; py=e.clientY; applyView(); });
window.addEventListener("pointerup", ()=>{ if(panning) panning=false; });
svg.addEventListener("dblclick", ()=>{ view.k=0.9; view.tx=0; view.ty=0; applyView(); });

function neighbors(id){
  const set=new Set([id]);

}

  selected=id;

  nodes.forEach(n=>{ if(keep.has(n.id)) nodeEls[n.id].classList.add("keep"); });

  updatePathActive(id);
}

/* ================= 3D 立体模式 ================= */
const edgeVis = {pre:true, rel:true, belong:true};   // 与 2D 过滤按钮共享
window.__edgeVis = edgeVis;
let mode3d = false;
const cam = {yaw:0.7, pitch:0.34, R:1500, f:1050, auto:true};
let d3 = {pts:[], minX:0,minY:0};
let cv = null, ctx3 = null, raf3 = 0, cvW=0, cvH=0;

function themeColors(){
  const dark = document.documentElement.getAttribute("data-theme")!=="light";
  return {
    lbl: dark ? "220,228,244" : "70,80,105",
    edgePre: dark ? "255,255,255" : "80,100,140",
    edgeRel: dark ? "255,255,255" : "80,100,140",
    edgeBelong: dark ? "255,255,255" : "80,100,140",
    bg: dark ? "#0a0f1e" : "#f6f1e2"
  };
}

function build3D(){
  const cx = W()/2, cy = H()/2;
  const mcount = MODULES.length;
  d3.pts = nodes.map(n=>{
    const mi = MODULES.findIndex(m=>m.id===n.mod);
    let h = 3; const key=n.id; for(let i=0;i<key.length;i++) h=(h*31+key.charCodeAt(i))|0;
    const jitter = ((h%13)-6)*6;
    return {id:n.id, hub:n.hub, x:(n.x-cx)*0.92, y:(n.y-cy)*0.92, z:(mi-(mcount-1)/2)*82 + (n.hub?0:jitter), r:n.r*1.1, mod:n.mod};
  });
  let D=0;
  d3.pts.forEach(p=>{ const dd=Math.hypot(p.x,p.y,p.z); if(dd>D)D=dd; });
  cam.R = D*3.0; cam.R = Math.max(cam.R, 900);
}

function rot(p){
  const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  const x1 = p.x*cy - p.z*sy;
  const z1 = p.x*sy + p.z*cy;
  const y2 = p.y*cp - z1*sp;
  const z2 = p.y*sp + z1*cp;
  return {x:x1, y:y2, z:z2};
}
function proj(p, cw, ch){
  const d = cam.R - p.z;
  const s = cam.f / Math.max(d, 60);
  return {sx: cw/2 + p.x*s, sy: ch/2 - p.y*s, s:s, d:d};
}

function draw3D(){
  const tc = themeColors();
  const cw = cvW, ch = cvH;
  ctx3.clearRect(0,0,cw,ch);
  // 背景淡色 + 微光
  ctx3.fillStyle = tc.bg; ctx3.fillRect(0,0,cw,ch);

  const show = p => { const q=rot(p); return proj(q,cw,ch); };
  // 1) 连线
  ctx3.lineCap="round";
  for(const l of links){
    if(!edgeVis[l.k]) continue;
    const a = d3.pts.find(p=>p.id===l.s), b = d3.pts.find(p=>p.id===l.t);
    if(!a||!b) continue;
    const pa=show(a), pb=show(b);
    const alphaBase = l.k==="pre" ? .62 : (l.k==="rel" ? .34 : .2);
    const depthA = Math.max(0, 1 - (cam.R - pa.d)/cam.R);
    const alpha = alphaBase * (0.45 + 0.55*Math.min(1, (pa.d+pb.d)/2/ (cam.R*0.6)));
    ctx3.beginPath(); ctx3.moveTo(pa.sx, pa.sy); ctx3.lineTo(pb.sx, pb.sy);
    const rgb = l.k==="pre" ? tc.edgePre : (l.k==="rel" ? tc.edgeRel : tc.edgeBelong);
    ctx3.strokeStyle = `rgba(${rgb},${alpha.toFixed(3)})`;
    ctx3.lineWidth = (l.k==="pre"?2.2:(l.k==="rel"?1.3:1.0)) * (pa.s+pb.s)/2 / 30;
    if(l.k==="rel"){ ctx3.setLineDash([6,6]); } else ctx3.setLineDash([]);
    ctx3.stroke();
  }
  ctx3.setLineDash([]);
  // 2) 节点（远→近）
  const order = d3.pts.map(p=>{ const q=show(p); return {p, q}; }).sort((a,b)=>b.q.d-a.q.d);
  for(const {p,q} of order){
    const m = modById[p.mod];
    const rad = p.r * q.s;
    const learnedFlag = !p.hub && learned.has(p.id);
    const sel = selected===p.id;
    const isHub = p.hub;
    // 光晕
    if(sel){ ctx3.beginPath(); ctx3.arc(q.sx,q.sy,rad+7,0,7); ctx3.strokeStyle="rgba(110,168,254,.9)"; ctx3.lineWidth=2; ctx3.stroke(); }
    if(learnedFlag){ ctx3.beginPath(); ctx3.arc(q.sx,q.sy,rad+4,0,7); ctx3.strokeStyle="rgba(62,207,142,.85)"; ctx3.lineWidth=2; ctx3.stroke(); }
    const depthK = Math.max(.25, Math.min(1, 1.25 - (cam.R-q.d)/cam.R*0.8));
    ctx3.beginPath(); ctx3.arc(q.sx,q.sy,Math.max(rad,2),0,7);
    ctx3.fillStyle = m.color; ctx3.globalAlpha = .28*depthK + .12;
    ctx3.fill();
    ctx3.globalAlpha = 1;
    ctx3.strokeStyle = m.color; ctx3.lineWidth = Math.max(1, (isHub?2.6:1.8)*depthK); ctx3.stroke();
    // 图标
    ctx3.font = `${Math.max(8, (isHub?15:11)*depthK)}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
    ctx3.textAlign="center"; ctx3.textBaseline="middle";
    ctx3.fillText(isHub ? modById[p.mod].icon : NODES[p.id].icon, q.sx, q.sy+1);
    // 标签
    const fs = Math.max(9, (isHub?13:11.5)*depthK);
    ctx3.font = `${isHub?700:400} ${fs}px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif`;
    ctx3.fillStyle = `rgba(${tc.lbl},${(0.5+0.5*depthK).toFixed(2)})`;
    ctx3.textBaseline="top";
    ctx3.fillText(isHub ? modById[p.mod].name : NODES[p.id].title, q.sx, q.sy + Math.max(rad,2) + 3);
  }
}

function loop3(){
  if(!mode3d) return;
  if(cam.auto && !dragging3) cam.yaw += 0.0022;
  draw3D();
  raf3 = requestAnimationFrame(loop3);
}

let dragging3=false, lx=0, ly=0, moved3=0;
function resizeCanvas(){
  if(!cv) return;
  const rect = document.getElementById("center").getBoundingClientRect();
  cvW = Math.max(1, rect.width); cvH = Math.max(1, rect.height);
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width = Math.max(1, Math.round(cvW*dpr));
  cv.height = Math.max(1, Math.round(cvH*dpr));
  cv.style.width = cvW+"px"; cv.style.height = cvH+"px";
  ctx3.setTransform(dpr,0,0,dpr,0,0);
}
function setupCanvas(){
  if(cv) return;
  const center = document.getElementById("center");
  cv = document.createElement("canvas");
  cv.id="cv3d";
  cv.style.cssText="position:absolute; inset:0; z-index:5; display:none; cursor:grab;";
  center.appendChild(cv);
  ctx3 = cv.getContext("2d");
  // 指针控制
  cv.addEventListener("pointerdown", e=>{
    dragging3=true; moved3=0; lx=e.clientX; ly=e.clientY; cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove", e=>{
    if(!dragging3) return;
    const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    moved3 += Math.abs(dx)+Math.abs(dy);
    cam.yaw -= dx*0.0055; cam.pitch = Math.max(-1.3, Math.min(1.3, cam.pitch - dy*0.0055));
  });
  const up = e=>{
    if(!dragging3) return;
    dragging3=false;
    if(moved3 < 6){ // 视为点击
      const rect = cv.getBoundingClientRect();
      const x=e.clientX-rect.left, y=e.clientY-rect.top;
      pick3(x,y);
    }
  };
  cv.addEventListener("pointerup", up);
  cv.addEventListener("pointercancel", ()=>{dragging3=false;});
  cv.addEventListener("wheel", e=>{
    e.preventDefault();
    cam.R = Math.max(500, Math.min(6000, cam.R * (1 + e.deltaY*0.001)));
  }, {passive:false});
  window.addEventListener("resize", resizeCanvas);
}
function pick3(x,y){
  let best=null, bestD=1e9;
  const cw=cvW, ch=cvH;
  for(const p of d3.pts){
    const q=rot(p); const pr=proj(q,cw,ch);
    const dist = Math.hypot(pr.sx-x, pr.sy-y);
    const thr = Math.max(14, p.r*pr.s);
    if(dist < thr && pr.d < bestD){ bestD=pr.d; best=p; }
  }
  if(best){ selectNode(best.id); }
}
function enter3D(){
  mode3d=true;
  build3D();
  setupCanvas();
  resizeCanvas();
  document.getElementById("graph").style.display="none";
  cv.style.display="block";
  cancelAnimationFrame(raf3);
  loop3();
}
function exit3D(){
  mode3d=false;
  cancelAnimationFrame(raf3);
  if(cv) cv.style.display="none";
  document.getElementById("graph").style.display="block";
}
function toggle3D(){
  if(mode3d) exit3D(); else enter3D();
  sync3DBtn();
}
function sync3DBtn(){
  const b = document.getElementById("btn3d");
  if(b) b.textContent = mode3d ? "🗺️ 2D 平面" : "🌐 3D 立体";
  const a = document.getElementById("btnAuto");
  if(a) a.classList.toggle("on", cam.auto);
}
// 入口按钮
(function initModeBar(){
  const bar = document.createElement("div");
  bar.className="modebar";
  const b3 = document.createElement("button"); b3.id="btn3d"; b3.className="hbtn"; b3.textContent="🌐 3D 立体"; b3.title="切换 3D 立体 / 2D 平面";
  b3.addEventListener("click", toggle3D);
  const ba = document.createElement("button"); ba.id="btnAuto"; ba.className="hbtn"; ba.textContent="⟳ 旋转:开"; ba.title="自动缓慢旋转开关";
  ba.addEventListener("click", ()=>{ cam.auto=!cam.auto; sync3DBtn(); });
  bar.append(b3, ba);
  document.getElementById("center").appendChild(bar);
  // 主题切换时无需重建（每帧读主题色）
})();
</script>
